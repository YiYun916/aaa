<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云居论坛 · 后台管理系统</title>
<style>
:root{
  --bg:#f5f6fa;--panel:#fff;--line:#e6e8ef;--text:#1f2430;--muted:#8b91a1;
  --primary:#4f6ef7;--green:#1aa873;--red:#e5484d;--amber:#e8a33d;--purple:#8b5cf6;
  --radius:12px;--shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.coin{color:#b8860b;font-weight:600}

/* ---------- 侧边栏 ---------- */
.sidebar{width:230px;flex:0 0 230px;background:linear-gradient(180deg,#171c30,#111527);color:#aab1c9;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.brand .logo{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:linear-gradient(135deg,#5b7cfa,#8b5cf6);display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px}
.brand h1{font-size:14.5px;margin:0;color:#fff;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-size:11px;color:#6b7492;font-weight:400}
.nav{padding:12px 10px;overflow:auto;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;margin-bottom:3px;transition:.15s;border:none;background:none;color:inherit;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:rgba(255,255,255,.07);color:#e6e9f5}
.nav-item.active{background:linear-gradient(135deg,rgba(91,124,250,.95),rgba(139,92,246,.95));color:#fff;box-shadow:0 6px 18px -8px rgba(91,124,250,.9)}
.nav-item .ico{width:20px;text-align:center;font-size:15px;flex:0 0 20px}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;color:#5b6484;line-height:1.7}

/* ---------- 主区域 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:30}
.topbar h2{margin:0;font-size:16px;font-weight:600}
.topbar .spacer{flex:1}
.content{padding:22px;display:flex;flex-direction:column;gap:16px;max-width:1640px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.3px}
.page-head .muted{font-size:13px}

/* ---------- 卡片 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-head h3{margin:0;font-size:14.5px;font-weight:600}
.pad{padding:16px 18px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px}
.filters .grow{flex:1;min-width:180px}
.divider{width:1px;height:22px;background:var(--line)}

/* ---------- 表单 ---------- */
.input,select.input,textarea.input{height:36px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px;color:var(--text);outline:none;transition:.15s;font-family:inherit;min-width:0}
select.input{padding-right:6px;cursor:pointer}
textarea.input{height:auto;padding:9px 11px;resize:vertical;line-height:1.6}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,110,247,.12)}
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.field .input{width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:4px 0 14px;cursor:pointer}

/* ---------- 按钮 ---------- */
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:13.5px;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
.btn:hover{background:#f3f5fb;border-color:#d3d8e8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,#5b7cfa,#6d5cf6);border-color:transparent;color:#fff;box-shadow:0 6px 16px -8px rgba(91,124,250,.9)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--red);border-color:#f2c9cb}
.btn.danger:hover{background:#fdf0f0}
.btn.success{color:var(--green);border-color:#c4e9da}
.btn.success:hover{background:#effaf5}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.xs{height:26px;padding:0 8px;font-size:12px;border-radius:6px}
.icon-btn{border:none;background:none;cursor:pointer;font-size:16px;color:var(--muted);width:30px;height:30px;border-radius:8px}
.icon-btn:hover{background:#f2f4fa;color:var(--text)}

/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:#f8f9fd;color:#6b7280;font-weight:600;text-align:left;padding:11px 14px;white-space:nowrap;border-bottom:1px solid var(--line);font-size:12.5px}
tbody td{padding:11px 14px;border-bottom:1px solid #f0f2f8;vertical-align:middle}
tbody tr:hover{background:#fafbff}
tbody tr:last-child td{border-bottom:none}
.empty{text-align:center;color:var(--muted);padding:34px 0 !important}
.cell-title{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ops{display:flex;flex-wrap:wrap;gap:5px}

/* ---------- 徽章 ---------- */
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;line-height:19px;font-weight:500;white-space:nowrap}
.badge.green{background:#e8f8f0;color:#128a5b}
.badge.red{background:#fdecec;color:#c93b40}
.badge.amber{background:#fdf4e5;color:#b07715}
.badge.blue{background:#eaf0ff;color:#3a5bd0}
.badge.purple{background:#f2ecff;color:#7c4ddb}
.badge.gray{background:#f0f2f7;color:#6b7280}

/* ---------- 统计卡 ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#9aa1b2}
.stat-card.blue::before{background:#4f6ef7}
.stat-card.green::before{background:#1aa873}
.stat-card.amber::before{background:#e8a33d}
.stat-card.red::before{background:#e5484d}
.stat-card.purple::before{background:#8b5cf6}
.stat-card.cyan::before{background:#06b6d4}
.stat-card.gold::before{background:#d4a017}
.stat-card.gray::before{background:#9aa1b2}
.stat-label{font-size:12.5px;color:var(--muted)}
.stat-value{font-size:23px;font-weight:700;margin-top:3px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}

/* ---------- 分页 ---------- */
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);background:#fcfcfe;flex-wrap:wrap;gap:10px;font-size:13px}
.pager-btns{display:flex;gap:8px}

/* ---------- 分段控件 / Tabs ---------- */
.seg{display:inline-flex;background:#f2f4fa;border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:6px 14px;border-radius:7px;font-size:13px;cursor:pointer;color:#5b6478;font-family:inherit;white-space:nowrap}
.seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.12)}

/* ---------- 提示 / 加载 ---------- */
.alert{padding:10px 14px;border-radius:9px;background:#f4f6fd;color:#4a5165;font-size:13px;margin-top:10px}
.alert.red{background:#fdecec;color:#b93a3f}
.alert.amber{background:#fdf4e5;color:#96660f}
.error-box{padding:26px;text-align:center;color:var(--red);font-size:13.5px;background:#fff;border:1px dashed #f2c9cb;border-radius:12px}
.loading{padding:34px;text-align:center;color:var(--muted);font-size:13px}
.loading::after{content:'';display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid #d6dae6;border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 详情 ---------- */
.detail-title{margin:0 0 10px;font-size:17px;font-weight:650;line-height:1.45}
.detail-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:14px;align-items:center}
.detail-content{background:#fafbff;border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-word;line-height:1.8;font-size:13.5px}
.detail-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.detail-images img{width:100%;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* ---------- 评论 ---------- */
.cmt{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.cmt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.cmt-body{margin-top:6px;font-size:13.5px;word-break:break-word;line-height:1.7}
.reply{border-left:3px solid #e6e8ef;padding:6px 0 6px 10px;margin-top:8px;font-size:13px}
.reply > div{margin-top:4px;word-break:break-word}

/* ---------- 弹窗 ---------- */
#modal-root{display:none}
.modal-mask{position:fixed;inset:0;background:rgba(17,21,39,.45);display:grid;place-items:center;padding:20px;z-index:100}
.modal{background:#fff;border-radius:16px;width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 60px -20px rgba(17,21,39,.5);animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:15.5px;font-weight:600}
.modal-head .icon-btn{margin-left:auto}
.modal-body{padding:18px 20px;overflow:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fcfcfe;border-radius:0 0 16px 16px}

/* ---------- Toast ---------- */
#toast-root{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:10px;background:#1f2430;color:#fff;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);animation:slide .2s ease;max-width:380px;line-height:1.5}
.toast.ok{background:#12855b}
.toast.err{background:#d63c42}
.toast.out{opacity:0;transform:translateX(14px);transition:.25s}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

/* ---------- 布局辅助 ---------- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.grid-2{grid-template-columns:1fr}}
@media(max-width:820px){
  .sidebar{width:66px;flex-basis:66px}
  .brand h1,.brand small,.nav-item .label,.side-foot{display:none}
  .nav-item{justify-content:center;padding:11px 0}
  .content{padding:14px}
  .topbar{padding:0 14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">云</div>
      <div>
        <h1>云居论坛</h1>
        <small>后台管理系统</small>
      </div>
    </div>
    <nav class="nav" id="navBox"></nav>
    <div class="side-foot">接口：ltt 模块<br>鉴权：appid / key</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="pageTitle">数据概览</h2>
      <div class="spacer"></div>
      <span class="badge gray" id="cfgStatus">未配置</span>
      <button class="btn" id="btnConfig">⚙ 接口配置</button>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ============================================================
 *  基础配置与状态
 * ============================================================ */
const LS_KEY = 'ltt_admin_cfg_v2'; // 修改了 Key 强制刷新旧配置

const state = {
  // 接口目录已更新为 /ltt/
  cfg: { base: 'https://yunju.99kpk.top/ltt/', appid: '', key: '' },
  page: 'dashboard',
  auditSwitch: false
};
try { 
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
  if (saved.base && saved.base.includes('/API/ltt')) {
    saved.base = saved.base.replace('/API/ltt', '/ltt'); // 自动修正老用户地址
  }
  Object.assign(state.cfg, saved); 
} catch (e) {}

function saveCfg() { localStorage.setItem(LS_KEY, JSON.stringify(state.cfg)); }

/* ============================================================
 *  通用工具
 * ============================================================ */
function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function fmtNum(n) {
  const v = Number(n);
  if (isNaN(v)) return (n === undefined || n === null || n === '') ? '-' : String(n);
  return v.toLocaleString('zh-CN');
}
function fmtTime(ts) {
  if (ts === undefined || ts === null || ts === '' || ts === 0 || ts === '0') return '-';
  let n = Number(ts);
  if (!n) return '-';
  const d = new Date(n < 1e12 ? n * 1000 : n);
  if (isNaN(d.getTime())) return '-';
  const p = x => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function asArray(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  try { const j = JSON.parse(v); return Array.isArray(j) ? j : []; } catch (e) { return []; }
}
function errorBox(msg) { return `<div class="error-box">⚠ ${esc(msg)}</div>`; }
function pageHead(title, sub) {
  return `<div class="page-head"><h2>${esc(title)}</h2><div class="muted">${esc(sub || '')}</div></div>`;
}
function toast(msg, type = 'ok') {
  const root = document.getElementById('toast-root');
  const div = document.createElement('div');
  div.className = 'toast ' + type;
  div.textContent = msg;
  root.appendChild(div);
  setTimeout(() => { div.classList.add('out'); setTimeout(() => div.remove(), 320); }, 2800);
}

/* ============================================================
 *  弹窗
 * ============================================================ */
function openModal(title, bodyHtml, footHtml) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" id="modalClose">✕</button></div>
      <div class="modal-body">${bodyHtml}</div>
      ${footHtml ? `<div class="modal-foot">${footHtml}</div>` : ''}
    </div>
  </div>`;
  root.style.display = 'block';
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalMask').onclick = e => { if (e.target.id === 'modalMask') closeModal(); };
  return root;
}
function closeModal() {
  const root = document.getElementById('modal-root');
  root.style.display = 'none';
  root.innerHTML = '';
}
function setModalBody(html) {
  const b = document.querySelector('#modal-root .modal-body');
  if (b) b.innerHTML = html;
}
function askReason(title, label) {
  return new Promise(resolve => {
    openModal(title, `<label class="field"><span>${esc(label)}</span><textarea id="reasonInput" class="input" rows="3" placeholder="请输入…"></textarea></label>`,
      `<button class="btn" id="rsCancel">取消</button><button class="btn primary" id="rsOk">确定</button>`);
    document.getElementById('rsCancel').onclick = () => { closeModal(); resolve(null); };
    document.getElementById('rsOk').onclick = () => {
      const v = document.getElementById('reasonInput').value.trim();
      closeModal(); resolve(v);
    };
  });
}

/* ============================================================
 *  接口请求
 * ============================================================ */
async function api(file, params = {}, opts = {}) {
  const { base, appid, key } = state.cfg;
  if (!appid || !key) throw new Error('请先点击右上角「接口配置」填写 appid 与 key');
  const url = String(base || '').replace(/\/+$/, '') + '/' + file;
  const body = new URLSearchParams();
  body.append('appid', appid);
  body.append('key', key);
  for (const [k, v] of Object.entries(params)) {
    if (v === undefined || v === null || v === '') continue;
    if (Array.isArray(v)) v.forEach(item => body.append(k + '[]', item));
    else body.append(k, v);
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), opts.timeout || 30000);
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      body,
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }
    });
  } catch (err) {
    clearTimeout(timer);
    throw new Error(err.name === 'AbortError' ? '请求超时' : '网络请求失败：' + err.message);
  }
  clearTimeout(timer);
  const text = await res.text();
  if (!res.ok) throw new Error(`HTTP ${res.status}：${text.slice(0, 120)}`);
  let json;
  try { json = JSON.parse(text); } catch (e) { throw new Error('返回非 JSON：' + text.slice(0, 160)); }
  if (Number(json.code) !== 1) throw new Error(json.msg || '接口返回失败');
  return json.data !== undefined ? json.data : json;
}

/* ============================================================
 *  板块缓存
 * ============================================================ */
let platesCache = null;
async function getPlates(force) {
  if (platesCache && !force) return platesCache;
  try {
    const d = await api('plate_list.php');
    platesCache = Array.isArray(d) ? d : (d.list || []);
  } catch (e) {
    platesCache = platesCache || [];
  }
  return platesCache;
}
function plateLabel(id) {
  if (!id && id !== 0) return '-';
  const p = (platesCache || []).find(x => String(x.plate_id) === String(id));
  return p ? (p.title || p.name || ('#' + id)) : ('#' + id);
}
function plateOptions(plates, selected, allLabel) {
  let html = `<option value="0">${esc(allLabel || '全部板块')}</option>`;
  (plates || []).forEach(p => {
    html += `<option value="${p.plate_id}" ${String(selected) === String(p.plate_id) ? 'selected' : ''}>${esc(p.title || ('板块 ' + p.plate_id))}</option>`;
  });
  return html;
}

/* ============================================================
 *  分页
 * ============================================================ */
function pagerHtml(total, page, size) {
  const t = Number(total || 0), p = Number(page || 1), s = Number(size || 20);
  const pages = Math.max(1, Math.ceil(t / s));
  return `<div class="pager">
    <span class="muted">共 ${fmtNum(t)} 条 · 第 ${p} / ${pages} 页</span>
    <div class="pager-btns">
      <button class="btn sm" data-pg="${p - 1}" ${p <= 1 ? 'disabled' : ''}>上一页</button>
      <button class="btn sm" data-pg="${p + 1}" ${p >= pages ? 'disabled' : ''}>下一页</button>
    </div>
  </div>`;
}
function bindPager(container, cb) {
  container.querySelectorAll('[data-pg]').forEach(b => {
    b.onclick = () => { if (!b.disabled) cb(Number(b.dataset.pg)); };
  });
}

/* ============================================================
 *  导航
 * ============================================================ */
const NAV = [
  { id: 'dashboard', name: '数据概览', icon: '📊' },
  { id: 'posts',     name: '帖子管理', icon: '📝' },
  { id: 'audit',     name: '审核管理', icon: '🛡️' },
  { id: 'plates',    name: '板块管理', icon: '🗂️' },
  { id: 'reports',   name: '举报管理', icon: '🚩' },
  { id: 'users',     name: '用户管理', icon: '👥' },
  { id: 'admins',    name: '管理员',   icon: '🔑' },
  { id: 'messages',  name: '通知私聊', icon: '💬' },
  { id: 'buys',      name: '购买记录', icon: '💰' }
];
const PAGES = {};

function buildNav() {
  const box = document.getElementById('navBox');
  box.innerHTML = NAV.map(n => `
    <button class="nav-item" data-page="${n.id}" title="${n.name}">
      <span class="ico">${n.icon}</span><span class="label">${n.name}</span>
    </button>`).join('');
  box.querySelectorAll('.nav-item').forEach(btn => {
    btn.onclick = () => renderPage(btn.dataset.page);
  });
}

async function renderPage(id) {
  state.page = id;
  const meta = NAV.find(n => n.id === id) || NAV[0];
  document.getElementById('pageTitle').textContent = meta.name;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === id));

    params.sort = postState.sort;

/* ============================================================
 *  帖子操作
 * ============================================================ */
async function handlePostAction(act, id, extra) {
  try {
    if (act === 'detail') return await showPostDetail(id);
    if (act === 'comments') return await showComments(id);

    if (act === 'top' || act === 'untop') {
      await api('post_top.php', { post_id: id, action: act });
      toast(act === 'top' ? '置顶成功' : '已取消置顶');
    } else if (act === 'approve') {
      await api('audit_post_operate.php', { post_id: id, audit_status: 1 });
      toast('审核通过');
    } else if (act === 'reject') {
      const reason = await askReason('拒绝审核 · 帖子 #' + id, '驳回理由（会通知作者）');
      if (reason === null) return;
      await api('audit_post_operate.php', { post_id: id, audit_status: 2, audit_reason: reason });
      toast('已拒绝');
    } else if (act === 'delete') {
      if (!confirm('确定删除该帖子？\n删除后评论、点赞、收藏、关注、浏览历史会一并清理，购买凭证保留。')) return;
      await api('post_delete.php', { post_id: id, user: extra });
      toast('删除成功');
    }
    refresh();
  } catch (e) {
    toast(e.message, 'err');
  }
}

function userBadges(u) {
  const out = [];
  if (Number(u.banned) === 1) out.push('<span class="badge red">封禁</span>');
  if (Number(u.muted) === 1) out.push('<span class="badge amber">禁言</span>');
  if (Number(u.post_restricted) === 1) out.push('<span class="badge purple">限发帖</span>');
  if (Number(u.comment_restricted) === 1) out.push('<span class="badge purple">限评论</span>');
  return out.length ? out.join(' ') : '<span class="badge green">正常</span>';
}

const UACT_TITLE = {
  ban: '封禁用户', unban: '解除封禁', mute: '禁言用户', unmute: '解除禁言',
  restrict_post: '限制发帖', allow_post: '恢复发帖',
  restrict_comment: '限制评论', allow_comment: '恢复评论'
};

function controlUser(targetUser, action) {
  const needUntil = action === 'ban' || action === 'mute';
  openModal(UACT_TITLE[action] + ' · ' + targetUser, `
    <label class="field"><span>原因（可选，最多 200 字）</span>
      <input id="ucReason" class="input" placeholder="将记录在用户管理状态中"></label>
    ${needUntil ? `<label class="field"><span>到期时间（留空 = 永久）</span>
      <input id="ucUntil" type="datetime-local" class="input"></label>` : ''}
  `, `<button class="btn" id="ucCancel">取消</button><button class="btn primary" id="ucOk">确定</button>`);

  document.getElementById('ucCancel').onclick = closeModal;
  document.getElementById('ucOk').onclick = async () => {
    const reason = document.getElementById('ucReason').value.trim();
    const el = document.getElementById('ucUntil');
    let until = 0;
    if (el && el.value) {
      const t = new Date(el.value).getTime();
      if (isNaN(t)) return toast('到期时间格式无效', 'err');
      until = Math.floor(t / 1000);
    }
    try {
      await api('user_admin_control.php', {
        target_user: targetUser,
        action,
        reason,
        until
      });
      closeModal();
      toast('操作成功');
      loadUserTable();
    } catch (e) { toast(e.message, 'err'); }
  };
}

    const box = document.getElementById('notifyBox');
    box.innerHTML = '<div class="loading">加载中…</div>';
    try {
      const [list, unread] = await Promise.all([
        api('notify_list.php', { user, page: 1, page_size: 20 }),
        api('notify_unread.php', { user }).catch(() => ({ unread_total: 0 }))
      ]);
      const arr = list.list || [];
      box.innerHTML = `
        <div class="muted" style="margin-bottom:10px">
          通知 ${fmtNum(list.total)} 条 · 未读 <b>${fmtNum(unread.unread_total || 0)}</b>
        </div>
        ${arr.length ? `<div class="table-wrap"><table>
          <thead><tr><th style="width:110px">类型</th><th>内容</th><th style="width:100px">来源</th><th style="width:130px">时间</th></tr></thead>
          <tbody>${arr.map(n => `<tr>
            <td><span class="badge ${Number(n.is_read) === 1 ? 'gray' : 'blue'}">${esc(n.type_text || n.type)}</span></td>
            <td>${esc(n.content || '-')}</td>
            <td>${esc(n.from_user || '-')}</td>
            <td class="muted nowrap">${fmtTime(n.create_time)}</td>
          </tr>`).join('')}</tbody>
        </table></div>` : '<div class="empty">暂无通知</div>'}`;
      box.dataset.user = user;
    } catch (e) {
      box.innerHTML = errorBox(e.message);
    }
  };

  document.getElementById('btnNotifyReadAll').onclick = async () => {
    const user = document.getElementById('ntUser').value.trim() || document.getElementById('notifyBox').dataset.user;
    if (!user) return toast('请输入用户账号', 'err');
    try {
      const d = await api('notify_read.php', { user, action: 'read', notify_id: 0 });
      toast(`已标记 ${d.affected !== undefined ? d.affected : 0} 条已读`);
      document.getElementById('btnNotify').click();
    } catch (e) { toast(e.message, 'err'); }
  };

  document.getElementById('btnChat').onclick = async () => {
    const user = document.getElementById('msgUser').value.trim();
    if (!user) return toast('请输入用户账号', 'err');
    const box = document.getElementById('chatBox');
    box.innerHTML = '<div class="loading">加载中…</div>';
    try {
      const d = await api('message_chat_list.php', { user });
      const arr = d.list || [];
      box.innerHTML = `
        <div class="muted" style="margin-bottom:10px">会话 ${fmtNum(d.total)} 个 · 未读 <b>${fmtNum(d.unread_total || 0)}</b></div>
        ${arr.length ? arr.map(c => `
          <div class="cmt" style="cursor:pointer" data-peer="${esc(c.peer)}">
            <div class="cmt-head">
              <b>${esc(c.name || c.peer)}</b>
              ${Number(c.unread) > 0 ? `<span class="badge red">${fmtNum(c.unread)} 未读</span>` : ''}
              <span class="muted" style="margin-left:auto">${fmtTime(c.last_time)}</span>
            </div>
            <div class="cmt-body muted" style="font-size:13px">${esc(c.last_content || '')}</div>
          </div>`).join('') : '<div class="empty">暂无会话</div>'}`;
      box.querySelectorAll('[data-peer]').forEach(el => {
        el.onclick = () => showChat(user, el.dataset.peer);
      });
    } catch (e) {
      box.innerHTML = errorBox(e.message);
    }
  };
};

async function showChat(user, peer) {
  openModal(`私聊记录 · ${user} ↔ ${peer}`, '<div class="loading">加载中…</div>', `<button class="btn" onclick="closeModal()">关闭</button>`);
  try {
    const d = await api('message_list.php', { user, target_user: peer, page: 1, page_size: 50 });
    const arr = d.list || [];
    setModalBody(`
      <div class="muted" style="margin-bottom:10px">共 ${fmtNum(d.total)} 条消息</div>
      ${arr.length ? arr.map(m => `
        <div class="cmt" style="border-left:3px solid ${m.from === user ? '#c7d2ff' : '#d8f0e3'}">
          <div class="cmt-head">
            <b>${esc(m.from)}</b>
            <span class="muted">${fmtTime(m.create_time)}</span>
            ${Number(m.is_read) === 1 ? '<span class="badge gray">已读</span>' : '<span class="badge amber">未读</span>'}
          </div>
          <div class="cmt-body">${esc(m.content)}</div>
        </div>`).join('') : '<div class="empty">暂无消息</div>'}`);
  } catch (e) {
    setModalBody(errorBox(e.message));
  }
}

/* ============================================================
 *  页面：购买记录
 * ============================================================ */
PAGES.buys = async function (root) {
  root.innerHTML = `
    ${pageHead('购买记录', '按帖子查购买者，或按用户查购买凭证')}
    <div class="card">
      <div class="filters">
        <input id="buyPostId" class="input" placeholder="帖子 ID" style="width:150px">
        <button class="btn primary" id="btnBuyer">查询该帖购买者</button>
        <div class="divider"></div>
        <input id="buyUser" class="input" placeholder="用户账号" style="width:190px">
        <button class="btn primary" id="btnMyBuy">查询用户购买记录</button>
      </div>
    </div>
    <div class="card" id="buyWrap"><div class="pad muted">请选择查询方式</div></div>`;

  document.getElementById('btnBuyer').onclick = async () => {
    const postId = document.getElementById('buyPostId').value.trim();
    if (!postId) return toast('请输入帖子 ID', 'err');
    const wrap = document.getElementById('buyWrap');
    wrap.innerHTML = '<div class="loading">加载中…</div>';
    try {
      const d = await api('post_buyer_list.php', { post_id: postId, page: 1, page_size: 50 });
      const arr = d.list || [];
      wrap.innerHTML = `
        <div class="card-head" style="border-bottom:1px solid var(--line)">
          <h3>帖子 #${esc(postId)} 购买者</h3>
          <span class="badge blue">购买 ${fmtNum(d.buyer_total !== undefined ? d.buyer_total : d.total)} 人</span>
          <span class="badge amber">累计收入 ${fmtNum(d.coin_total)} 金币</span>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th style="width:200px">购买者</th><th style="width:160px">昵称</th><th style="width:130px">支付金币</th><th style="width:170px">购买时间</th></tr></thead>
          <tbody>${arr.length ? arr.map(b => `<tr>
            <td><b>${esc(b.user)}</b></td><td>${esc(b.name || '-')}</td>
            <td class="coin">${fmtNum(b.coin)}</td><td class="muted nowrap">${fmtTime(b.create_time)}</td>
          </tr>`).join('') : '<tr><td colspan="4" class="empty">暂无购买记录</td></tr>'}</tbody>
        </table></div>`;
    } catch (e) {
      wrap.innerHTML = errorBox(e.message);
    }
  };

  document.getElementById('btnMyBuy').onclick = async () => {
    const user = document.getElementById('buyUser').value.trim();
    if (!user) return toast('请输入用户账号', 'err');
    const wrap = document.getElementById('buyWrap');
    wrap.innerHTML = '<div class="loading">加载中…</div>';
    try {
      const d = await api('my_buy_list.php', { user, page: 1, page_size: 50 });
      const arr = d.list || [];
      wrap.innerHTML = `
        <div class="card-head" style="border-bottom:1px solid var(--line)">
          <h3>${esc(user)} 的购买记录</h3><span class="badge blue">共 ${fmtNum(d.total)} 条</span>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th style="width:80px">帖子ID</th><th>标题</th><th style="width:130px">作者</th>
          <th style="width:110px">支付金币</th><th style="width:150px">购买时间</th><th style="width:110px">状态</th></tr></thead>
          <tbody>${arr.length ? arr.map(b => `<tr>
            <td>#${esc(b.post_id)}</td>
            <td class="cell-title" title="${esc(b.title)}">${esc(b.title || '-')}</td>
            <td>${esc(b.user_name || b.user || '-')}</td>
            <td class="coin">${fmtNum(b.pay_coin)}</td>
            <td class="muted nowrap">${fmtTime(b.buy_time)}</td>
            <td>${Number(b.post_deleted) === 1 ? '<span class="badge red">原帖已删除</span>' : '<span class="badge green">正常</span>'}</td>
          </tr>`).join('') : '<tr><td colspan="6" class="empty">暂无购买记录</td></tr>'}</tbody>
        </table></div>`;
    } catch (e) {
      wrap.innerHTML = errorBox(e.message);
    }
  };
};
