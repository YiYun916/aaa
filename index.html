<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云禾资源库</title>
<link rel="icon" href="appIcon.png">
<style>
#splash,#splash.hide,.splash-box,.splash-logo,.splash-name,.splash-sub,.splash-bar{display:none}
:root{--pri:#ff4a3a;--pri2:#ff8a3a;--bg:#f3f4f7;--card:#fff;--txt:#14151a;--sub:#98a0b3;--line:#ececf2;--rk:16px;--dark:#181a25}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,"PingFang SC","SF Pro",sans-serif;background:var(--bg);color:var(--txt);max-width:480px;margin:0 auto;min-height:100vh}
#app{min-height:100vh;padding-bottom:80px}
.hidden{display:none!important}
/* ===== 顶部品牌栏 ===== */
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2) 60%,var(--pri2));color:#fff;padding:18px 16px 14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .logo{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:1px}
.hero .logo svg{width:26px;height:26px;fill:#fff}
.hero .slogan{font-size:12px;opacity:.9;margin-top:2px}
.searchbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);border-radius:12px;padding:10px 13px}
.searchbox svg{width:18px;height:18px;fill:none;stroke:var(--pri);stroke-width:2}
.searchbox input{border:none;outline:none;flex:1;font-size:16px;background:transparent;color:var(--txt)}
/* ===== 分类标签 ===== */
.pills{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:8px 16px;border-radius:20px;background:var(--card);color:var(--sub2);font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line)}
.pill.active{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:none;box-shadow:0 4px 12px rgba(255,74,58,.28)}
/* ===== 顶部小工具栏 ===== */
.toolbar{background:var(--card);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(20,24,50,.05)}
.toolbar .t{font-size:17px;font-weight:800;flex:1;text-align:center;min-width:0;padding:0 78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar .btn-sm{display:inline-flex;align-items:center;gap:4px;padding:7px 13px;font-size:13px;border-radius:20px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;cursor:pointer;border:none;box-shadow:0 3px 10px rgba(255,74,58,.3)}
.toolbar .btn-sm svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.toolbar .back{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:4px;padding:5px 9px;font-size:13px;border-radius:20px;background:#f2f4fa;color:var(--sub2);cursor:pointer;border:none;z-index:2}
.toolbar .back svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ===== 通用 ===== */
.card{background:var(--card);border-radius:var(--rk);margin:10px 12px;padding:14px;box-shadow:0 2px 12px rgba(20,24,50,.05)}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:14px;font-size:15px;font-weight:700;text-align:center;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(255,74,58,.3)}
.btn-ghost{background:#f2f4fa;color:var(--sub2)}
.btn:disabled{opacity:.5}
.input{width:100%;padding:12px 14px;border:none;background:#f2f4fa;border-radius:12px;font-size:16px;outline:none;color:var(--txt)}
input,textarea{font-size:16px}
.label{font-size:13px;color:var(--sub);margin:14px 0 6px;display:block;font-weight:600}
.empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px}
/* ===== 游戏卡片（3:4封面网格） ===== */
.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px 14px}
.game-card{cursor:pointer;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,50,.06)}
.game-card .cover{position:relative;width:100%;aspect-ratio:3/4;background:linear-gradient(135deg,#ff4a3a22,#ff8a3a22);overflow:hidden}
.game-card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.game-card .cover .tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;backdrop-filter:blur(4px)}
.game-card .info{padding:9px 10px}
.game-card .gname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-card .gmeta{display:flex;align-items:center;gap:3px;color:var(--sub);font-size:10px;margin-top:4px}
.game-card .gmeta svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
/* ===== 游戏横向卡片（UP 列表） ===== */
.game-row{display:flex;gap:10px;background:var(--card);border-radius:12px;padding:9px;margin:0 12px 8px;cursor:pointer;box-shadow:0 1px 6px rgba(20,24,50,.05);position:relative}
.game-row .grow-cover{width:52px;height:52px;border-radius:12px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#ff4a3a22,#ff8a3a22)}
.game-row .grow-cover img{width:100%;height:100%;object-fit:cover;display:block}
.game-row .grow-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.game-row .gname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-row .gmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.game-row .gm{font-size:9px;color:var(--sub2);background:#f2f4fa;border-radius:6px;padding:1px 5px}
.game-row .gfoot{display:flex;align-items:center;gap:4px;color:var(--sub);font-size:10px;margin-top:6px}
.game-row .gfoot svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.game-row .store-dl{flex-shrink:0;width:auto;height:30px;padding:0 12px;align-self:center;border:none;border-radius:9px;background:linear-gradient(135deg,#00c98d,#00e0a4);color:#fff;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;line-height:1}
.game-row .store-dl svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.fab{position:fixed;right:18px;bottom:86px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,74,58,.4);z-index:80;cursor:pointer;line-height:1}
.rows{padding:6px 0}
.grid{display:flex;flex-wrap:wrap;padding:4px 8px}
.grid .scard{width:calc(50% - 16px);box-sizing:border-box;margin:8px}
.h-scroll2{display:flex;gap:10px;overflow-x:auto;padding:6px 10px;-webkit-overflow-scrolling:touch;touch-action:pan-x !important;overscroll-behavior-x:contain}
.h-scroll2::-webkit-scrollbar{display:none}
.h-scroll2 .scard{flex-shrink:0;width:150px}
.scard{background:var(--card);border-radius:12px;padding:8px;cursor:pointer;box-shadow:0 2px 8px rgba(20,24,50,.06);position:relative}
.scard .scov{width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#f0f1f6;display:flex;align-items:center;justify-content:center}
.scard .scov img{width:100%;height:100%;object-fit:cover}
.scard .nm{font-size:13px;font-weight:700;margin-top:6px;color:#1c2033;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .sb{font-size:10px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== 资源详情页 ===== */
.gd-top{display:flex;gap:14px;padding:18px 16px;background:linear-gradient(135deg,#e7f6ee,#dcf0e7)}
.gd-ico{width:72px;height:72px;border-radius:16px;overflow:hidden;flex-shrink:0;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.10)}
.gd-ico img{width:100%;height:100%;object-fit:cover;display:block}
.gd-ico .ph{height:100%;display:flex;align-items:center;justify-content:center;color:#8ab39a}
.upbadge{display:inline-block;font-size:10px;color:var(--pri);background:#ffe9e6;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;font-weight:700}
.vip-badge{display:inline-block;height:14px;width:auto;vertical-align:-2px;margin-left:5px;border-radius:2px;flex:0 0 auto}
.av-vip .vip-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% + 16px);height:calc(100% + 16px);pointer-events:none;z-index:3;border-radius:50%}
.vip-name{background:linear-gradient(90deg,#ff3b30,#ffa63a);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.vip-name .nick-t,.vip-name b,.vip-name i{background:linear-gradient(90deg,#ff3b30,#ffa63a);-webkit-background-clip:text;background-clip:text;color:transparent}
.vip-name .lv{background:linear-gradient(135deg,#f6c24a,#ff7a18);-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:#fff;color:#fff}
.vip-name img{background:none;-webkit-text-fill-color:initial;color:initial}
.post-head .nick{display:flex;align-items:center;white-space:nowrap}
.post-head .nick .nick-t{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post-head .nick .lv{flex:0 0 auto}
#gd .gd-up div:nth-child(2) div:first-child{display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.au-head{display:flex;gap:14px;padding:20px 16px;background:linear-gradient(180deg,#e2f3ea,#ffffff);flex-wrap:wrap}
.au-head .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.au-info{flex:1;display:flex;flex-direction:column;justify-content:center}
.au-name{font-size:19px;font-weight:800;color:#1c2033;display:flex;align-items:center;white-space:nowrap;min-width:0}
.au-name .nick-t{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.au-stats{display:flex;gap:10px;margin-top:8px;font-size:12px;color:var(--sub2)}
.au-stats span{background:var(--card);border-radius:8px;padding:3px 10px}
.au-card{flex:1 0 100%;margin-bottom:16px;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(20,24,50,.08)}
.au-card img{width:100%;display:block}
.scrs-prev{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.scrs-prev img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid #eef0f5}
.zoom-mask{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.zoom-mask img{max-width:94vw;max-height:94vh;border-radius:10px;display:block}
.gd-ico .ph svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.5}
.gd-head2{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.gd-title{font-size:20px;font-weight:800;color:#17382a}
.gd-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
.gd-tags span{font-size:11px;background:rgba(255,255,255,.85);color:#2b6b4f;padding:3px 9px;border-radius:8px;font-weight:700}
.gd-time{font-size:11px;color:var(--sub2);margin-top:7px}
.gd-up{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid #f2f4fa}
.gd-acts{display:flex;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid #f2f4fa}
.gd-acts button{flex:1;padding:10px;border:none;border-radius:12px;background:#f2f4fa;color:var(--txt);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.gd-acts button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sf-bar{display:flex;gap:8px;padding:10px 12px;overflow-x:auto}
.sf-chip{flex:0 0 auto;display:flex;align-items:center;gap:4px;height:34px;padding:0 12px;background:var(--card);border:1.5px solid #eef0f5;border-radius:18px;font-size:13px;color:var(--txt);cursor:pointer;white-space:nowrap;box-shadow:0 1px 4px rgba(20,24,50,.03)}
.sf-chip:active{background:#f4f6fb}
.sf-chip svg{width:14px;height:14px;stroke:#98a0b3}
.hot-entry{display:flex;align-items:center;gap:8px;margin:12px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,#fff3e6,#ffe9d6);color:#d84315;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(216,67,21,.08)}
.hot-entry svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hot-entry .cnt{margin-left:auto;font-size:11px;color:#bf5b2c;font-weight:600}
.rank-badge{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:3}
.ht-tabs{display:flex;gap:8px;padding:10px 14px;background:#f4f5f9}
.ht-tabs .tab{flex:1;padding:10px;border:none;border-radius:12px;background:var(--card);color:var(--sub2);font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.ht-tabs .tab.on{background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff}
.scard[data-id],.game-row[data-id]{scroll-margin-top:8px}
.top-badge{display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;color:#fff;background:#ff6a2a;border-radius:6px;padding:1px 5px;vertical-align:middle;margin-right:6px}
.pay-badge{display:inline-flex;align-items:center;gap:2px;font-size:10px;font-weight:700;color:#c93c1f;background:#ffe9e0;border-radius:6px;padding:1px 6px;vertical-align:middle;margin-right:6px}
.pay-badge svg,.top-badge svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pay-lock{background:var(--card)8f3;border:1px dashed #ffb38a;border-radius:12px;padding:20px 16px;text-align:center}
.pay-lock .lock-ic{width:44px;height:44px;margin:0 auto 10px;border-radius:12px;background:#ffe9e0;color:#ff6a2a;display:flex;align-items:center;justify-content:center}
.pay-lock .lock-ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pay-lock .lock-tip{font-size:13px;color:#7a4a32;margin-bottom:12px}
.pay-lock .lock-tip b{color:#ff6a2a}
.pay-switch{display:inline-flex;width:52px;height:30px;border-radius:15px;background:#e4e7ef;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.pay-switch .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.pay-switch.on{background:linear-gradient(90deg,var(--pri),var(--pri2))}
.pay-switch.on .knob{left:25px}
.pay-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 2px}
.pay-row .lbl{font-size:13px;font-weight:600;color:var(--txt)}
.pay-row .sub{font-size:11px;color:var(--sub);margin-top:2px}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2000;padding:24px;animation:fadein .2s ease}
.modal-card{background:var(--card);border-radius:18px;padding:22px 20px;width:min(320px,88vw);box-shadow:0 12px 40px rgba(0,0,0,.2);animation:pop .22s ease}
.modal-tit{font-size:16px;font-weight:800;color:#1c2033;text-align:center;margin-bottom:10px}
.modal-msg{font-size:14px;color:var(--sub2);text-align:center;line-height:1.6}
.modal-acts{display:flex;gap:10px;margin-top:20px}
.modal-acts .btn{flex:1}
.modal-input{margin-top:14px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
.dl-mask{position:fixed;inset:0;background:rgba(20,22,30,.45);display:flex;align-items:center;justify-content:center;z-index:2100;padding:22px;animation:fadein .18s ease}
/* 弹窗全量阻止背景滑动穿透；抽屉/面板内部保留纵向滚动 */
.dl-mask,.sheet-mask,.upd-mask,.ban-mask,.modal-mask{touch-action:none}
.sheet-mask .ws-sheet,.sheet-mask .sheet-panel,.modal-mask .ws-sheet,.modal-mask .sheet-panel,.modal-mask .modal-card .ws-sheet{touch-action:pan-y}
.dl-sheet{width:100%;max-width:min(92vw,440px);background:var(--card);border-radius:22px;padding:24px 16px 14px;box-shadow:0 18px 50px rgba(0,0,0,.28);animation:pop .22s cubic-bezier(.2,.9,.3,1.15);position:relative;text-align:center}
.dl-close{position:absolute;top:10px;right:14px;width:30px;height:30px;border:0;background:transparent;color:#8a909b;font-size:22px;line-height:1;cursor:pointer}
.dl-ic{width:52px;height:52px;margin:2px auto 10px;border-radius:16px;background:#eef2fb;display:flex;align-items:center;justify-content:center}
.dl-ic svg{width:26px;height:26px;stroke:#4a6cf7}
.dl-sheet h2{margin:0 0 6px;font-size:19px;font-weight:700;color:#2b3a67;letter-spacing:1px}
.dl-desc{font-size:13px;color:#7a818c;line-height:1.7;margin:0 6px 14px}
.dl-opts{display:flex;flex-direction:column;gap:4px;background:#f6f7fb;border-radius:16px;padding:6px}
.dl-opt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:9px 8px;border-radius:12px;text-align:left;font-family:inherit;color:inherit;cursor:pointer}
.dl-opt:active{background:rgba(74,108,247,.09)}
.dl-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.dl-ico svg{width:22px;height:22px}
.dl-ico.blue{background:#e6efff}.dl-ico.orange{background:var(--card)1e2}.dl-ico.gray{background:#eef0f4}
.dl-opt .dl-txt{display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left}
.dl-opt b{font-size:15px;font-weight:600;color:#20242b;line-height:1.2}
.dl-opt small{font-size:12px;color:#8b919c;line-height:1.35}
.dl-acts{display:flex;gap:12px;margin-top:16px}
.dl-btn{flex:1;height:46px;border:0;border-radius:12px;background:#4a6cf7;color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
.dl-btn:active{filter:brightness(.9)}
.dl-copy{display:block;margin:12px auto 2px;border:0;background:transparent;color:#4a6cf7;font-size:15px;font-weight:600;font-family:inherit;padding:8px 18px;cursor:pointer}
.dl-prog-box{width:100%;max-width:min(340px,88vw);background:var(--card);border-radius:16px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.dl-prog-title{font-size:14px;color:#2b3a67;margin-bottom:14px;word-break:break-all;line-height:1.45}
.dl-prog-bar{height:8px;background:#eef2fb;border-radius:4px;overflow:hidden}
.dl-prog-fill{height:100%;width:0;background:#4a6cf7;border-radius:4px;transition:width .2s}
.dl-prog-meta{font-size:12px;color:#8b919c;margin-top:10px;text-align:right}
.dl-opt.off,.dl-btn.off{opacity:.45}
.dl-opt.off b,.dl-opt.off small{color:#9aa0ab}
.dl-note{font-size:12px;color:#a06a1f;background:var(--card)6e8;border-radius:10px;padding:8px 10px;margin:10px 2px 0;line-height:1.6;text-align:left}
.gd-tabs{display:flex;background:var(--card);padding:0 16px;gap:16px;border-bottom:1px solid #f2f4fa}
.gd-tabs .tab{flex:1;padding:12px 0;border:none;background:none;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
.gd-tabs .tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.tab-pane{padding:12px 16px 96px;background:#f7f8fc}
.dl-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(20,24,50,.04)}
.dl-head{display:flex;align-items:center;gap:6px;font-weight:800;margin-bottom:10px}
.dl-head svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.dl-btns{display:flex;gap:10px}
.dl-btns .dlb{flex:1;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:800;font-size:14px;cursor:pointer}
.sec-card{background:var(--card);border-radius:16px;margin-bottom:12px;padding:16px;box-shadow:0 2px 8px rgba(20,24,50,.04)}
.sec-h{display:flex;align-items:center;gap:6px;font-weight:800;margin-bottom:10px}
.sec-h svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
/* ===== 每日一更 / 推荐 ===== */
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 2px}
.sec-head .tt{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px}
.sec-head .tt::before{content:"";width:5px;height:18px;border-radius:3px;background:linear-gradient(180deg,var(--pri),var(--pri2))}
.sec-head .more{color:var(--sub);font-size:13px;cursor:pointer}
.h-scroll{display:flex;gap:12px;overflow-x:auto;padding:12px 14px;-webkit-overflow-scrolling:touch;touch-action:pan-x !important;overscroll-behavior-x:contain}
.h-scroll::-webkit-scrollbar{display:none}
.feat{flex-shrink:0;width:150px;background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 10px rgba(20,24,50,.06)}
.feat .cover{width:100%;aspect-ratio:16/10;background:#f0f1f6;overflow:hidden}
.feat .cover img{width:100%;height:100%;object-fit:cover}
.feat .fi{padding:8px 10px}
.feat .fn{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .fa{font-size:10px;color:var(--sub);margin-top:2px}
/* ===== 游戏详情页 ===== */
.gd-hero{position:relative;background:linear-gradient(160deg,var(--pri),var(--pri2) 90%);color:#fff;padding:20px 16px 90px}
.gd-hero .gd-cover{position:absolute;left:16px;bottom:-56px;width:96px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.gd-hero .gd-cover img{width:100%;height:100%;object-fit:cover}
.gd-head{padding:0 16px;margin-top:78px}
.gd-title{font-size:20px;font-weight:800}
.gd-sub{display:flex;align-items:center;gap:8px;color:var(--sub2);font-size:12px;margin-top:6px}
.avatar{background:linear-gradient(135deg,#ff5f45,#ff3b30);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;border:2px solid #fff;box-shadow:0 2px 8px rgba(255,59,48,.25)}
.dl-card{background:var(--card);border-radius:16px;margin:14px 12px;padding:14px;box-shadow:0 2px 12px rgba(20,24,50,.05)}
.dl-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.dl-row:last-child{border:none}
.dl-row .lk{flex:1;font-size:13px;color:var(--sub2);word-break:break-all}
.dl-row .dlb{flex-shrink:0;padding:7px 14px;border-radius:20px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:13px;font-weight:700;cursor:pointer;border:none}
.sec-card{background:var(--card);border-radius:16px;margin:12px 12px;padding:14px}
.sec-card .tt{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-card .tt::before{content:"";width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--pri),var(--pri2))}
.gd-desc{font-size:14px;line-height:1.7;color:#3a4156;white-space:pre-wrap}
/* ===== 评论 ===== */
.cmt{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border:none}
.cmt .cmt-body{flex:1}
.cmt .cmt-name{font-size:13px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;column-gap:2px}
.cmt .cmt-time{font-size:10px;color:var(--sub);margin-top:2px}
.cmt .cmt-text{font-size:14px;color:#2c2f3a;line-height:1.5;margin-top:5px}
.cmt-stick{width:22px;height:22px;border-radius:4px;object-fit:cover;vertical-align:bottom;margin:1px 2px;display:inline-block}
.cmt-editor{min-height:36px;line-height:1.5;white-space:pre-wrap;word-break:break-word;outline:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.cmt-editor img.stick-edit{width:22px;height:22px;border-radius:4px;object-fit:cover;display:inline-block}
.cmt-editor:empty:before{content:attr(data-ph);color:#9aa1b0;pointer-events:none}
.cmt .cmt-text{word-break:break-word}
/* ===== 发资源表单 ===== */
.form-card{background:var(--card);border-radius:16px;margin:12px;padding:16px}
.uploadbox{border:1.5px dashed #d1d6e0;border-radius:14px;padding:20px;text-align:center;color:var(--sub);font-size:13px;cursor:pointer;background:#fafbfe}
.uploadbox.preview{padding:0;border:none}
.uploadbox.preview img{width:100%;max-height:180px;object-fit:cover;border-radius:12px}
/* ===== 上传进度弹窗 ===== */
.upd-mask{position:fixed;inset:0;background:rgba(20,24,50,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:2200;display:flex;align-items:center;justify-content:center;animation:fadein .2s ease;padding:24px}
.upd-box{width:min(330px,88vw);background:var(--card);border-radius:22px;padding:22px 20px 18px;box-shadow:0 24px 60px rgba(20,24,50,.3);animation:pop .35s cubic-bezier(.2,1.4,.4,1);overflow:hidden}
.upd-head{display:flex;gap:12px;align-items:center}
.upd-ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 6px 14px rgba(255,74,58,.35)}
.upd-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ===== 下载管理列表 ===== */
.dl-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.dl-ic2{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 5px 12px rgba(255,74,58,.28)}
.dl-ic2 svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dl-it-body{flex:1;min-width:0}
.dl-it-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-it-meta{font-size:11px;color:var(--sub);margin-top:3px;display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.dl-it-dir{font-size:11px;color:#9aa5b8;margin-top:4px;display:flex;align-items:center;gap:5px}
.dl-it-dir .dot-dir{width:6px;height:6px;border-radius:50%;background:#b6c0d4;flex-shrink:0}
.dl-it-act{display:flex;gap:8px;flex-shrink:0}
.dl-a{height:30px;padding:0 12px;border:none;border-radius:8px;background:#f1f3f8;color:#3d72f0;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.dl-a.danger{background:var(--card)1f0;color:#ff4d4f}
.dl-a:active{opacity:.7}
/* ===== 我的页：服务卡片 ===== */
.profile-settings{position:absolute;top:16px;right:14px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#8a92a6;border-radius:10px;cursor:pointer}
.profile-settings svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.profile-settings:active{background:#f1f3f8;color:var(--pri)}
.turns-wrap{padding:10px 12px 2px}
.turns-track{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.turns-track::-webkit-scrollbar{display:none}
.turn-cell{flex:0 0 100%;height:150px;border-radius:14px;background-size:cover;background-position:center;position:relative;overflow:hidden;scroll-snap-align:start;cursor:pointer;box-shadow:0 4px 14px rgba(78,124,255,.12)}
.turn-mask{position:absolute;left:0;right:0;bottom:0;padding:36px 16px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.turn-cap{color:#fff;font-size:15px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn-sub{color:rgba(255,255,255,.72);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc-head{font-size:13px;font-weight:700;color:var(--sub2);margin:18px 16px 10px}
.svc-card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 12px;padding:8px 6px}
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.svc-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;border-radius:12px;cursor:pointer;font-size:12px;color:var(--txt)}
.svc-item:active{background:#f4f5f8}
.svc-ic{width:40px;height:40px;border-radius:12px;background:#f4f6fb;color:var(--pri);display:flex;align-items:center;justify-content:center}
.svc-ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plate-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 12px}
.plate-cell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.plate-cell:active{background:#f4f5f8}
.plate-cell img{width:36px;height:36px;border-radius:8px;object-fit:cover;background:#f4f6fb;flex-shrink:0}
.plate-cell .ptic{width:36px;height:36px;border-radius:8px;background:#f4f6fb;color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.plate-cell .pinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.plate-cell .pn{font-size:13px;font-weight:700;color:#1c2033;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate-cell .ps{font-size:11px;color:var(--sub)}
/* ===== 设置页 ===== */
.set-row{display:flex;align-items:center;gap:10px;padding:14px 2px;cursor:pointer;border-bottom:1px solid var(--line)}
.set-row:last-child{border:none}
.set-row .set-label{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;flex-shrink:0;color:var(--txt)}
.set-row .set-label svg{width:18px;height:18px;color:var(--pri);fill:none;stroke:currentColor;stroke-width:2}
.set-val{font-size:12px;color:#8a92a6;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-sec{font-size:13px;font-weight:700;color:var(--sub2);margin:18px 16px 10px}
.set-opt{display:flex;align-items:center;gap:10px;padding:14px 2px;cursor:pointer;border-bottom:1px solid var(--line)}
.set-opt:last-child{border:none}
.set-opt b{font-size:14px;font-weight:600;color:var(--txt)}
.set-opt small{display:block;color:#8a92a6;font-size:11px;margin-top:3px}
.set-check{width:20px;height:20px;border-radius:50%;border:2px solid #d4d8e2;flex-shrink:0;margin-left:auto}
.set-opt.on .set-check{border-color:var(--pri);background:radial-gradient(circle,var(--pri) 0 5px,#fff 5px)}
/* ===== 外观设置页 ===== */
.appear-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 12px 12px}
.as-h{font-size:13px;font-weight:700;color:var(--sub2);margin-bottom:12px}
.as-seg{display:flex;gap:8px}
.as-seg-btn{flex:1;height:38px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px;color:var(--txt);cursor:pointer;font-family:inherit}
.as-seg-btn.on{background:linear-gradient(135deg,var(--pri,#ff4a3a),var(--pri2,#ff8a3a));color:#fff;border-color:transparent}
.as-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px}
.as-color{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:#666}
.as-color .sw{width:34px;height:34px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.14);border:2px solid transparent}
.as-color.on .sw{border-color:var(--txt);box-shadow:0 0 0 3px rgba(20,21,26,.12)}
.as-color.on .lbl{color:var(--pri);font-weight:600}
/* ===== 金币提现页 ===== */
.wd-bal-card{margin:14px 12px;background:linear-gradient(135deg,var(--pri),var(--pri2));border-radius:18px;padding:22px;color:#fff;text-align:center}
.wd-bal-lbl{font-size:13px;opacity:.92}
.wd-bal{font-size:34px;font-weight:900;margin-top:6px}
.wd-bal .u{font-size:15px;font-weight:700}
.wd-bal-hint{font-size:11px;opacity:.85;margin-top:6px}
.wd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 12px}
.wd-tier{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;cursor:pointer;position:relative}
.wd-tier.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.wd-tier.off{opacity:.55}
.wd-tier .c{font-size:16px;font-weight:800;color:var(--txt)}
.wd-tier .c span{font-size:11px;font-weight:600;color:var(--sub2)}
.wd-tier .m{font-size:13px;color:var(--pri);font-weight:700;margin-top:4px}
.wd-tier .e{position:absolute;top:5px;right:5px;font-size:9px;color:#ff4d4f}
.wd-btn{margin:20px 12px 0;width:calc(100% - 24px)}
/* ===== 提现协议底部弹层 ===== */
.ws-sheet{width:100%;max-width:520px;background:var(--card);border-radius:26px 26px 0 0;padding:6px 18px 18px;max-height:70vh;overflow:auto;margin-top:auto;animation:wsUp .3s cubic-bezier(.2,.9,.3,1.08)}
@keyframes wsUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.ws-handle{width:38px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 14px}
.ws-h{font-size:17px;font-weight:800;text-align:center}
.ws-detail{background:var(--bg);border-radius:14px;padding:6px 14px;margin:12px 0 4px}
.ws-row{display:flex;justify-content:space-between;padding:10px 0;font-size:13px;color:var(--sub2);border-bottom:1px solid var(--line)}
.ws-row:last-child{border:none}
.ws-row b{color:var(--txt)}
.ws-row b.ac{color:var(--pri)}
.ws-fl{font-size:12px;color:var(--sub2);margin:12px 2px 6px}
.ws-seg{display:flex;gap:10px}
.ws-seg button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:14px;cursor:pointer}
.ws-seg button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.ws-fields .input{width:100%;box-sizing:border-box;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--txt);padding:0 12px;font-size:15px;margin-top:2px}
.ws-at{font-size:14px;font-weight:700;margin-bottom:6px}
.ws-agree{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:12px}
.ws-agree p{font-size:12px;color:var(--sub2);line-height:1.7;margin:0 0 8px}
.ws-agree p:last-child{margin-bottom:0}
.ws-sheet .modal-acts{margin-top:16px}
/* ===== 金币商城 ===== */
.sh-search{position:relative;display:flex;align-items:center;height:40px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:0 12px;margin:10px 12px 8px;box-sizing:border-box}
.sh-ico{display:flex;align-items:center;color:var(--sub2);margin-right:6px}
.sh-ico svg{width:16px;height:16px;fill:currentColor}
.sh-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:13px;color:var(--txt);height:100%}
.sh-search input::placeholder{color:#b7bcc5}
.sh-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 12px 16px}
.sh-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.sh-card:active{transform:scale(.98)}
.sh-card-img{position:relative;aspect-ratio:1;background:var(--bg);overflow:hidden}
.sh-card-img img{width:100%;height:100%;object-fit:cover;display:block}
.sh-card-img .sh-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--sub2)}
.sh-card-img .sh-ph svg{width:42px;height:42px;fill:currentColor}
.sh-badge{position:absolute;top:8px;left:8px;font-size:10px;color:#fff;background:var(--pri);border-radius:6px;padding:2px 8px;font-weight:600}
.sh-card-body{padding:10px 11px 12px}
.sh-card-name{font-size:13.5px;font-weight:600;color:var(--txt);line-height:1.4;height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sh-sub{font-size:11px;color:var(--sub2);margin-top:3px}
.sh-row{margin-top:8px}
.sh-price{font-size:18px;font-weight:800;color:var(--pri);line-height:1}
.sh-price i{font-style:normal;font-size:12px;font-weight:700;margin-left:2px}
/* 商品详情底部弹层 */
.sd-img{position:relative;aspect-ratio:16/9;background:var(--bg);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-top:2px}
.sd-img img{width:100%;height:100%;object-fit:cover;display:block}
.sd-img .sh-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--sub2)}
.sd-img .sh-ph svg{width:52px;height:52px;fill:currentColor}
.sd-name{font-size:17px;font-weight:800;color:var(--txt);margin-top:12px}
.sd-desc{font-size:12px;color:var(--sub2);line-height:1.6;margin-top:6px}
.sd-meta{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sd-price{font-size:20px;font-weight:800;color:var(--pri)}
.sd-price i{font-style:normal;font-size:12px;font-weight:700;margin-left:2px}
.sd-extra{font-size:12px;color:var(--sub2)}
.upd-name{font-size:15px;font-weight:700;color:#1c2033;word-break:break-all;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.upd-meta{font-size:12px;color:var(--sub);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.upd-bar{height:9px;border-radius:5px;background:#eef0f5;margin-top:16px;overflow:hidden}
.upd-fill{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .25s ease}
.upd-foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.upd-pct{font-size:17px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
.upd-state{font-size:12px;color:var(--sub)}
.upd-ok .upd-ic{background:linear-gradient(135deg,#00c98d,#00e6a0);box-shadow:0 6px 14px rgba(0,201,141,.35)}
.upd-ok .upd-fill{background:linear-gradient(90deg,#00c98d,#00e6a0)}
.upd-ok .upd-pct{color:#00c98d}
.upd-err .upd-ic{background:linear-gradient(135deg,#f43f5e,#ff6b81);box-shadow:0 6px 14px rgba(244,63,94,.35)}
.upd-err .upd-fill{background:linear-gradient(90deg,#f43f5e,#ff6b81)}
.upd-err .upd-pct{color:#f43f5e}
/* ===== 底部导航 ===== */
#tabbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(0,0,0,.05);display:flex;height:72px;z-index:100;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(20,24,50,.06)}
#tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--sub);cursor:pointer;gap:3px;padding:11px 0 8px;position:relative}
.msg-badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--pri);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px #fff}
.notify-dot{min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--pri);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1}
#tabbar .tab.active{color:var(--pri)}
#tabbar .tab .ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center}

.post-content.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post-foot{display:flex;align-items:center;gap:4px;margin-top:12px;color:var(--sub);font-size:12px}

.post-foot .sp{flex:1}
.imgrow{display:flex;gap:6px;margin-top:8px;flex-wrap:nowrap;overflow-x:auto}
.imgrow img{width:110px;height:110px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#eee;cursor:pointer}

.stage{overflow:hidden!important}
.rows>*,.grid>*,.h-scroll>*,.h-scroll2>*,.imgrow>*,.plist>*{animation:fadeup .45s ease both}
.rows>*:nth-child(2),.grid>*:nth-child(2),.h-scroll>*:nth-child(2),.h-scroll2>*:nth-child(2),.imgrow>*:nth-child(2){animation-delay:.05s}
.rows>*:nth-child(3),.grid>*:nth-child(3),.h-scroll>*:nth-child(3),.h-scroll2>*:nth-child(3),.imgrow>*:nth-child(3){animation-delay:.10s}
.rows>*:nth-child(4),.grid>*:nth-child(4),.h-scroll>*:nth-child(4),.h-scroll2>*:nth-child(4),.imgrow>*:nth-child(4){animation-delay:.15s}
.rows>*:nth-child(5),.grid>*:nth-child(5),.h-scroll>*:nth-child(5),.h-scroll2>*:nth-child(5){animation-delay:.20s}
.rows>*:nth-child(6),.grid>*:nth-child(6),.h-scroll>*:nth-child(6),.h-scroll2>*:nth-child(6){animation-delay:.25s}
.rows>*:nth-child(7),.grid>*:nth-child(7){animation-delay:.30s}
.rows>*:nth-child(8),.grid>*:nth-child(8){animation-delay:.35s}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.post-acts{display:flex;gap:16px;padding:8px 16px;font-size:13px;color:#4e7cff;cursor:pointer;font-weight:600}

.post-acts span{display:inline-flex;align-items:center;gap:5px}
.post-acts .act.on{color:var(--pri)}
.post-acts .act.on svg{fill:currentColor;stroke:currentColor}
.pact{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:none;background:#f2f4fa;color:var(--sub2);border-radius:8px;cursor:pointer;margin-left:8px}
.pact svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pact:first-of-type{margin-left:0}
.cmt-ops{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}

.cmt-ops .op.on{color:var(--pri)}
.cmt-ops .op.del{color:#ff6b6b}
.replies{margin:8px 0 4px;padding-left:8px;border-left:2px solid var(--line)}
.cmt.sub{background:transparent;margin-top:4px}
.badge{display:inline-block;background:var(--pri);color:#fff;font-size:10px;border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.lg-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#1b2a4a 0%,#244a7a 52%,#3a7a9a 100%);position:relative;overflow:hidden}
.lg-wrap::before,.lg-wrap::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}

.lg-wrap::after{width:340px;height:340px;bottom:-100px;left:-80px}
.lg-card{width:100%;max-width:360px;background:rgba(255,255,255,.97);border-radius:26px;padding:30px 24px;box-shadow:0 24px 60px rgba(0,0,0,.28);position:relative;z-index:1;animation:fadeup .5s ease both}
.lg-logo{width:64px;height:64px;border-radius:20px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4e7cff,#7a5cff);color:#fff}

.lg-title{font-size:22px;font-weight:800;text-align:center;color:var(--txt)62b}
.lg-sub{font-size:13px;color:#8a93a8;text-align:center;margin:4px 0 24px}
.lg-field{display:flex;align-items:center;gap:10px;background:#f4f6fb;border:1px solid #e8ecf5;border-radius:14px;padding:12px 14px;margin-bottom:12px}

.lg-field input{border:none;outline:none;background:transparent;flex:1;font-size:16px;color:var(--txt)62b;min-width:0}
.lg-btn{width:100%;height:48px;border:none;border-radius:14px;background:linear-gradient(135deg,#4e7cff,#7a5cff);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:6px}
.lg-links{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;color:#4e7cff}
.lg-links span{cursor:pointer}
/* ===== 登录/注册页（合并自 login.html：4 角色 + 眼睛跟随动效，单列适配移动端） ===== */
.page{position:relative;display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.left{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:calc(24px + env(safe-area-inset-top)) 16px 0;background:linear-gradient(135deg,#9ca3af,#6b7280,#4b5563);color:#fff;overflow:hidden}
.blob1,.blob2{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.blob1{top:25%;right:25%;width:256px;height:256px;background:rgba(156,163,175,.2)}
.blob2{bottom:25%;left:25%;width:384px;height:384px;background:rgba(209,213,219,.2)}
.grid-overlay{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 20px),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 20px);pointer-events:none}
.characters-wrap{position:relative;z-index:20;display:flex;align-items:flex-end;justify-content:center;height:220px}
.characters{position:relative;width:550px;height:400px;transform:scale(0.45);transform-origin:bottom center}
.char{position:absolute;bottom:0;transition:all .7s cubic-bezier(.4,0,.2,1);transform-origin:bottom center}
.char-purple{left:70px;width:180px;height:400px;background:#6c3ff5;border-radius:10px 10px 0 0;z-index:1}
.char-purple .eyes-wrap{position:absolute;display:flex;gap:32px;transition:all .7s cubic-bezier(.4,0,.2,1)}
.char-black{left:240px;width:120px;height:310px;background:#2d2d2d;border-radius:8px 8px 0 0;z-index:2}
.char-black .eyes-wrap{position:absolute;display:flex;gap:24px;transition:all .7s cubic-bezier(.4,0,.2,1)}
.char-orange{left:0;width:240px;height:200px;background:#ff9b6b;border-radius:120px 120px 0 0;z-index:3}
.char-orange .eyes-wrap{position:absolute;display:flex;gap:32px;transition:all .2s ease-out}
.char-yellow{left:310px;width:140px;height:230px;background:#e8d754;border-radius:70px 70px 0 0;z-index:4}
.char-yellow .eyes-wrap{position:absolute;display:flex;gap:24px;transition:all .2s ease-out}
.char-yellow .mouth{position:absolute;width:80px;height:4px;background:#2d2d2d;border-radius:4px;transition:all .2s ease-out}
.eyeball{border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:height .15s;background:var(--card)}
.eyeball .pupil{border-radius:50%;background:#2d2d2d;transition:transform .1s ease-out}
.pupil-only{border-radius:50%;background:#2d2d2d;transition:transform .1s ease-out}
.right{display:flex;flex:1;align-items:stretch;padding:28px 22px calc(32px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#ffffff,#f3f4f6)}
.form-box{width:100%;max-width:420px;display:flex;flex-direction:column;margin:0 auto}
.form-box .header{text-align:center;margin-bottom:28px}
.form-box .header h1{font-size:28px;font-weight:800;margin-bottom:6px;color:var(--txt)}
.form-box .header p{color:#6b7280;font-size:14px}
.field{margin-bottom:18px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field input{width:100%;height:48px;padding:0 16px;border:1px solid var(--line);border-radius:8px;font-size:16px;outline:none;background:var(--card);transition:border-color .2s;-webkit-appearance:none}
.field input:focus{border-color:var(--txt)}
.field .input-wrap{position:relative}
.field .input-wrap input{padding-right:44px}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:2;background:none;border:none;cursor:pointer;color:#9ca3af;transition:color .2s;padding:4px}
.toggle-pw:hover{color:var(--txt)}
.toggle-pw svg{width:20px;height:20px;pointer-events:none}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.row .remember{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.row .remember input[type="checkbox"]{width:16px;height:16px;accent-color:var(--txt);cursor:pointer}
.row a{font-size:14px;font-weight:500;color:var(--txt);cursor:pointer;text-decoration:none}
.hover-btn{position:relative;width:100%;height:48px;border-radius:9999px;border:1px solid var(--line);background:var(--card);cursor:pointer;overflow:hidden;font-size:16px;font-weight:600;color:var(--txt)}
.hover-btn .label{display:inline-block;transition:all .3s}
.hover-btn .overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:8px;background:#111;color:#fff;border-radius:9999px;opacity:0;transition:opacity .3s}
.hover-btn:hover .label{transform:translateX(48px);opacity:0}
.hover-btn:hover .overlay{opacity:1}
.hover-btn.loading{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent;color:#fff;pointer-events:none;box-shadow:0 6px 16px rgba(255,74,58,.3)}
.hover-btn.loading .label{color:#fff;opacity:1}
.hover-btn.loading .overlay{opacity:0}
.hover-btn .spin{display:none}
.hover-btn.loading .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:btnspin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes btnspin{to{transform:rotate(360deg)}}
.arrow-icon{width:16px;height:16px}
.divider{text-align:center;margin-top:auto;padding:30px 0 24px;font-size:14px;color:#6b7280}
.divider a{color:var(--txt);font-weight:500;cursor:pointer;text-decoration:none}

  if(p&&p.user&&a&&String(p.user)===String(a.user)&&USER.name){return USER.name}
  if(/^\d{4,}$/.test(String(un))&&p&&p.user&&a&&String(p.user)===String(a.user)){return USER.name||USER.user_name||un}
  return un||(p&&p.user?String(p.user):"UP主");
}

function gameName(p){return String(p.title||"").replace(/^\s*\[(游戏|软件)(分享|资源)\]\s*/,"").replace(/^\s*\[小程序\]\s*/,"")}
function parseMeta(content){
  var m={name:"",ver:"",dl:"",back:"",desc:"",pkg:"",mem:"",jump:""};
  if(!content)return m;
  var known=function(k){return /游戏名称|资源名称|^名称$|版本|跳转链接|下载链接|备用链接|包名|内存|大小|简介/.test(k)};
  var set=function(k,v){
    if(/游戏名称|资源名称|^名称$/.test(k))m.name=v;else if(/版本/.test(k))m.ver=v;
    else if(/跳转链接/.test(k))m.jump=v;else if(/下载链接/.test(k))m.dl=v;else if(/备用链接/.test(k))m.back=v;
    else if(/包名/.test(k))m.pkg=v;else if(/内存|大小/.test(k))m.mem=v;
    else if(/简介/.test(k))m.desc=v;
  };
  String(content).split(/\n/).forEach(function(line){
    var i=line.indexOf(":");var k=i<0?"":line.slice(0,i).trim();
    if(k&&known(k)){set(k,line.slice(i+1).trim())}
    else if(i>=0||line.trim()){if(m.desc)m.desc+="\n"+line.trim()}
  });
  return m;
}

  stage.addEventListener("touchend",function(){

function refreshMsgBadge(){
  var b=document.getElementById("msgBadge"),nb=document.getElementById("notifyBadge");
  if(!b&&!nb)return;
  var a=auth();if(!a){if(b)b.style.display="none";if(nb)nb.style.display="none";return}
  var n=0,nN=0,done=0;
  function upd(){
    if(done>=2){
      if(b){if(n>0){b.textContent=n>99?"99+":n;b.style.display="flex"}else{b.style.display="none"}}
      if(nb){if(nN>0){nb.textContent=nN>99?"99+":nN;nb.style.display="inline-flex"}else{nb.style.display="none"}}
    }
  }
  apiPost(CONFIG.forumBase+"message_chat_list.php",forumAuth().concat([["user",a.user]])).then(function(j){
    var d=j&&j.data;(d&&d.list||[]).forEach(function(c){n+=Number(c.unread||0)});done++;upd();
  }).catch(function(){done++;upd()});
  apiPost(CONFIG.forumBase+"notify_list.php",forumAuth().concat([["user",a.user],["page_size","50"]])).then(function(j){
    (listData(j)||[]).forEach(function(x){if(x.is_read==="0"||x.is_read===0){n++;nN++}});done++;upd();
  }).catch(function(){done++;upd()});
}

var TAB_SCROLL={},LAST_TAB="";
function firstVisibleEl(){
  var cands=document.querySelectorAll(".scard[data-id],.game-row[data-id]");
  var vh=window.innerHeight||900;
  for(var i=0;i<cands.length;i++){var r=cands[i].getBoundingClientRect();if(r.top>=0&&r.top<vh*0.6)return cands[i]}
  return cands[0]||null;
}
function saveScroll(tab){
  if(!tab)return;
  var el=firstVisibleEl();
  TAB_SCROLL[tab]={y:window.scrollY,anchor:el?el.getAttribute("data-id"):""};
}
function restoreScroll(tab){
  var s=TAB_SCROLL[tab];if(!s)return;
  if(s.anchor){var el=document.querySelector('.scard[data-id="'+s.anchor+'"],.game-row[data-id="'+s.anchor+'"]');if(el){el.scrollIntoView({block:"start"});return}}
  window.scrollTo(0,s.y||0);
}

var CUR_TAB="home";
// 底部导航根页：这些页面之间互相切换不应往历史栈里压记录
var TAB_ROUTES={home:1,discover:1,up:1,msg:1,profile:1};
// 登录/注册互切也走 replace：反复“去登录/去注册”时不再往返回栈压记录，杜绝界面/历史层层堆叠
var REPLACE_ROUTES={login:1,register:1};
function go(route){
  var r=String(route==null?"home":route);
  var t=r.charAt(0)==="#"?r.slice(1):r;
  var target="#"+t;
  if(t==="discover") SEARCH_KW=""; // 点击发现时清空搜索状态
  if(TAB_ROUTES[t]||REPLACE_ROUTES[t]){
    // 底部导航 / 登录注册切换：用 replace 替换当前历史条目，避免在返回栈里层层堆叠
    if(location.hash!==target){location.replace(target)}
    else if(typeof renderRoute==="function"){renderRoute()}
  }else{
    // 子页面：正常压入历史，返回时逐级回退
    if(location.hash!==target){location.hash=target}
    else if(typeof renderRoute==="function"){renderRoute()}

/* 弹窗压入历史栈（拦截系统返回）与配对回退：每次打开/关闭严格抵消，避免历史栈堆叠 */
function openMaskPush(m){document.body.appendChild(m);m._maskPush=1;try{history.pushState({__mask:1},"")}catch(e){}}
function closeMaskPush(m){if(m&&m.parentNode)m.parentNode.removeChild(m);if(m&&m._maskPush){m._maskPush=0;window._skipPop=1;try{history.back()}catch(e){}}}
function histBack(){
  var v=document.getElementById("viewer");
  if(v&&!v.classList.contains("hidden")){closeViewer();return}
  // 先关闭可能打开的任意弹窗（下载/选择/确认/进度等）
  var m=openMaskAny();
  if(m){m.remove();return}
  // 栈底判断：当前正处于底部导航根页（首页/发现/UP/消息/我的）→ 应退出 App，而不是返回上一页
  var cur=curTabOf(location.hash.replace("#",""));
  if(cur){exitApp();return}
  try{
    if(history.length>1){history.back();return}
  }catch(e){}
  exitApp();
}
window.addEventListener("hashchange",renderRoute);
window.addEventListener("popstate",function(){
  if(window._skipPop){window._skipPop=0;return} /* 主动回退历史（closeMaskPush 抵消），非用户返回，忽略 */
  var m=openMaskAny();
  if(m){
    if(m._maskPush)m._maskPush=0;
    m.remove(); /* 系统返回已消费该历史层，不再 go(1) 恢复，避免残留一层导致要多划一次 */
    return;
  }
  var v=document.getElementById("viewer");
  if(v&&!v.classList.contains("hidden")){
    closeViewer();
    setTimeout(function(){try{history.go(1)}catch(e){}},0);
  }
});

  t=t.replace(/\[file\](.*?)(?:\|(.*?))?\[\/file\]/g,function(mm,u,n){ph.push({type:'file',url:u,name:n||'点击下载附件'});return "\u0000p"+(c++)+"\u0000"});
  t=t.replace(/\[link\](.*?)(?:\|(.*?))?\[\/link\]/g,function(mm,u,n){ph.push({type:'link',url:u,name:n||u});return "\u0000p"+(c++)+"\u0000"});
  
  var out=esc(t).replace(/\n/g,"<br>");
  out=out.replace(/(https?:\/\/[^\s<>\[\]"'，。；、！？\u4e00-\u9fa5]+)/g,'<a href="javascript:void(0)" class="plain-link" onclick="openMiniLink(\'$1\')">$1</a>');
  out=out.replace(/\[贴纸:([^\]\s]+)\]/g,function(mm,n){return STICKER_NAMES.indexOf(n)>=0?'<img src="png/'+n+'.png" class="cmt-stick">':mm});
  out=out.replace(/\u0000p(\d+)\u0000/g,function(mm,i){

    } else if(item.type === 'img') {

function fmtDur(s){s=Math.floor(s||0);var m=Math.floor(s/60),ss=s%60;return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss}

/* ================= 统一文件选择（强逼系统文件管理器） ================= */
function pickFile(opts, onFile) {
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "*/*"; // 【关键】不写 image/*，强制调起纯文件管理器
  if (opts && opts.multiple) inp.multiple = true;
  inp.onchange = function() {
    var f = inp.files && inp.files[0];
    if (!f) return;
    if (opts && opts.validate) {
      var err = opts.validate(f);
      if (err) {
        toast(err);
        inp.value = "";
        return;
      }
    }
    if (onFile) onFile(inp);
  };
  inp.click();
}

// 在光标处插入文本
function insertAtCursor(myValue) {
  var myField = document.getElementById("cp_content");
  if (!myField) return;
  if (document.selection) {
    myField.focus();
    var sel = document.selection.createRange();
    sel.text = myValue;
  } else if (myField.selectionStart || myField.selectionStart === 0) {
    var startPos = myField.selectionStart;
    var endPos = myField.selectionEnd;
    myField.value = myField.value.substring(0, startPos) + myValue + myField.value.substring(endPos, myField.value.length);
    myField.selectionStart = startPos + myValue.length;
    myField.selectionEnd = startPos + myValue.length;
  } else {
    myField.value += myValue;
  }
  myField.focus();
}

function videoPoster(file,cb){
  var url=URL.createObjectURL(file);
  var v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=url;
  var done=false;
  function fin(d){if(done)return;done=true;URL.revokeObjectURL(url);cb(d)}
  function shot(){try{var c=document.createElement("canvas");c.width=v.videoWidth||480;c.height=v.videoHeight||270;c.getContext("2d").drawImage(v,0,0,c.width,c.height);fin(c.toDataURL("image/jpeg",0.85))}catch(e){fin("")}}
  v.onloadedmetadata=function(){try{v.currentTime=Math.min(0.1,(v.duration||1)*0.05)}catch(e){}};
  v.onseeked=function(){shot()};
  v.onerror=function(){fin("")};
  setTimeout(function(){if(!done){try{if(v.videoWidth&&v.readyState>=2)shot();else fin("")}catch(e){fin("")}}},4500);
}
function dataURLtoBlob(d){
  var m=d.match(/^data:([^;,]+)?/);var base64=d.indexOf("base64")>=0;
  var bin=base64?atob(d.split(",")[1]):decodeURIComponent(d.split(",")[1]);
  var arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:m&&m[1]?m[1]:"image/jpeg"});
}

function updateDlProgress(loaded,total){
  var f=document.getElementById("dlprogfill"),pct=document.getElementById("dlprogpct"),sz=document.getElementById("dlprogsize"),st=document.getElementById("dlprogstate");
  if(!f)return;
  var p=total>0?Math.round(loaded/total*100):0;
  f.style.width=Math.max(2,p)+"%";
  if(pct)pct.textContent=p+"%";
  if(sz)sz.textContent=fmtSize(loaded)+" / "+fmtSize(total);
  if(st)st.textContent="正在下载…";
}
function hideDlProgress(){clearInterval(DL_PROG_TIMER);if(DL_PROG_EL){closeMaskPush(DL_PROG_EL);DL_PROG_EL=null}}
/* ===== 下载管理：本地下载记录（localStorage 持久化） ===== */
var DL_KEY="yh_dl_list";
function dlLoad(){try{var a=JSON.parse(localStorage.getItem(DL_KEY)||"[]");return a instanceof Array?a:[]}catch(e){return[]}}
function dlSave(a){try{localStorage.setItem(DL_KEY,JSON.stringify((a||[]).slice(0,60)))}catch(e){}}
function dlFind(id){var a=dlLoad();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function dlRecord(r){var a=dlLoad();a.unshift(r);dlSave(a)}
function dlUpdate(id,p){var a=dlLoad();for(var i=0;i<a.length;i++)if(a[i].id===id){for(var k in p)a[i][k]=p[k];break}dlSave(a)}
function dlRemove(id){dlSave(dlLoad().filter(function(r){return r.id!==id}))}
function dlClearAll(){confirmDialog("确定清空全部下载记录吗？（不会删除已下载的文件）",function(){dlSave([]);renderDlList();toast("已清空")})}
function doActLocal(url){
  var n=fileNameOf(url);
  showDlProgress(n); // 始终先弹出下载弹窗
  var rec={id:Date.now(),url:url,name:n,size:0,status:"downloading",time:Math.floor(Date.now()/1000),dir:""};
  dlRecord(rec); // 写入下载记录（列表页实时可见“下载中”）
  var done=false,minShow=900,started=Date.now();
  function finish(tip,ok){
    if(done)return;done=true;
    dlUpdate(rec.id,{status:ok?"done":"failed"});
    var remain=Math.max(0,minShow-(Date.now()-started)); // 至少显示约0.9秒，避免一闪而过
    setTimeout(function(){hideDlProgress();if(tip)toast(tip)},remain);
  }
  // WebCatX 原生流式下载（带真实进度，同步到下载记录）
  if(window.webcat&&webcat.download&&typeof webcat.download.stream==="function"){
    var target=null;
    var dir=(getSet().dlDir||"/storage/emulated/0/Download/").trim();
    if(dir.charAt(dir.length-1)!=="/")dir+="/";
    try{if(webcat.ext&&webcat.ext.isFullAccess&&webcat.ext.isFullAccess().granted){target={source:"root",path:dir+n}}}catch(e){}
    if(!target)target={source:"fs",path:"downloads/"+n};
    rec.dir=(target.source==="root"?dir:"应用目录 downloads/");dlUpdate(rec.id,{dir:rec.dir});
    try{
      webcat.download.stream({url:url,source:target.source,path:target.path,onProgress:function(e){
        var p=e&&e.progress?e.progress:e;
        if(p&&typeof p.loaded!=="undefined"){updateDlProgress(p.loaded,p.total);dlUpdate(rec.id,{size:p.loaded})}
      }}).then(function(){finish(target.source==="root"?"已保存到系统Download目录":"已保存到应用目录",true)})
      .catch(function(){mediaFallback()});
      return;
    }catch(e){}
  }
  // 兜底：media.saveToDownload / 浏览器下载
  mediaFallback();
  function mediaFallback(){
    try{if(window.webcat&&webcat.media&&typeof webcat.media.saveToDownload==="function"){rec.dir="系统 Download 目录";dlUpdate(rec.id,{dir:rec.dir});webcat.media.saveToDownload(n,url);finish("已保存到系统Download目录",true);return}}catch(e){}
    try{rec.dir="系统默认下载目录";dlUpdate(rec.id,{dir:rec.dir});downLocal(url);finish("已开始下载",true)}catch(e){finish("下载失败",false)}
  }
}

function isDirectLink(url){
  var h="";try{h=String(new URL(url).hostname).toLowerCase()}catch(e){return false}
  // 1) 网盘/分享站域名 → 非直链（无法软件内本地下载）
  var pans=["pan.","drive","uc","xunlei","quark","aliyun","lanzou","baidu","wps","189","caiyun","yunpan","115","10086","feixin","migu","ydpan","mcloud","pan-cloud","yun.","123pan","weiyun","kuaipan","cowtransfer","wenshushu","jianguoyun","dropbox","mega","aliyundrive","onedrive","sharepoint","tencent","qq.com","panxunlei","tianyi"];
  for(var i=0;i<pans.length;i++)if(h.indexOf(pans[i])>=0)return false;
  // 2) 分享结构特征（路径/参数）→ 非直链，即使域名未识别
  var lu=url.toLowerCase();
  if(/\/share\/|\/sharing\/|shareid=|pwd=|from=|share_token=|\/portal\/|\/s\/|\/detail\//.test(lu))return false;
  // 3) 真正直链：URL 以常见文件扩展名结尾
  if(/\.(apk|zip|rar|7z|exe|tar|gz|iso|bin|pdf|docx?|xlsx?|ppt|pptx|mp4|mp3|png|jpe?g|gif|webp|txt)$/i.test(url.split("?")[0].split("#")[0]))return true;
  // 4) 保守兜底：无法确认是直链 → 一律非直链
  return false;
}

function startDownload(){
  var url=GD_DL;if(!url){toast("该资源暂无下载链接");return}
  var mode=(getSet().dlMode||"default");
  if(mode==="browser"){doActBrowser(url);return}
  if(mode==="copy"){doActCopy(url);return}
  if(mode==="local"){if(isDirectLink(url)){doActLocal(url);return}/* 不支持本地下载 → 回退默认弹窗 */}
  showDownload();
}

function pubApk(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  if(!/\.(apk|zip)$/i.test(f.name||"")){toast("仅支持 APK / ZIP 文件");return}
  if(checkFileSize(f,"apk")){toast("安装包超过大小限制（上限2GB）");inp.value="";return}
  var base=(f.name||"").replace(/\.(apk|zip)$/i,"");
  var vm=base.match(/[vV]?(\d+\.\d+(\.\d+)?)/);
  if(vm){var v=document.getElementById("pg_ver");if(v&&!v.value)v.value=vm[1]}
  var clean=base.replace(/[vV]?(\d+\.\d+(\.\d+)?)/g,"").replace(/[_\-]+/g," ").replace(/\.+/g," ").trim();
  if(clean){var n=document.getElementById("pg_name");if(n&&!n.value)n.value=clean}
  var pkgm=base.match(/com\.[a-z0-9]+(\.[a-z0-9]+){1,}/i);
  if(pkgm){var pk=document.getElementById("pg_pkg");if(pk&&!pk.value)pk.value=pkgm[0]}
  var mb=f.size/1024/1024;var mem=document.getElementById("pg_mem");
  if(mem&&!mem.value)mem.value=(mb>=1024?(mb/1024).toFixed(1)+"GB":Math.max(1,Math.round(mb))+"MB");
  var st=document.getElementById("pg_apkstate");
  if(st)st.textContent="安装包上传中…";
  // 现代化上传弹窗：文件名 / 大小 / 开始时间 / 实时进度
  showUpdDialog(f.name,f.size);
  uploadFile(f,function(url){
      document.getElementById("pg_dl").value=url;
      if(st)st.textContent="✔ 上传成功，下载链接已自动填入";
      updDone(true,"上传完成，下载链接已自动填入");
    },function(e){
      if(st)st.textContent="上传失败："+e;
      updDone(false,e||"上传失败");
    },function(p){updProg(p)});
}
function checkFileSize(f,kind){
  var max=kind==="apk"?2048:kind==="video"?30:2; // apk:2GB, video:30MB, 其余(图片):2MB
  if(!f||f.size>max*1024*1024){
    var unit=kind==="apk"?"GB":"MB";
    var shown=kind==="apk"?(max/1024):max;
    return "文件超过大小限制（上限"+shown+unit+"）";
  }
  return "";
}
function tsName(orig){
  var d=new Date(),p=function(n){return (n<10?"0":"")+n};
  // 精确到秒 + 随机后缀：避免同一分钟内上传多张图片（如3张截图）文件名相同、互相覆盖
  var base=""+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+Math.floor(Math.random()*90+10);
  var m=String(orig||"").match(/\.([a-zA-Z0-9]+)$/);
  return base+(m?"."+m[1]:"");
}
/* ===== 上传进度弹窗 ===== */
var UPD_TIMER=null,UPD_START=0;
function fmtSize(b){b=b||0;if(b>=1073741824)return (b/1073741824).toFixed(2)+"GB";if(b>=1048576)return (b/1048576).toFixed(1)+"MB";if(b>=1024)return Math.round(b/1024)+"KB";return b+"B"}
function fmtClock(d){var p=function(n){return(n<10?"0":"")+n};return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}
function showUpdDialog(name,size){
  var old=document.getElementById("upd_mask");if(old)old.remove();
  var m=document.createElement("div");m.className="upd-mask";m.id="upd_mask";
  m.innerHTML='<div class="upd-box" id="upd_box">'
    +'<div class="upd-head"><div class="upd-ic">'+icon("download")+'</div>'
    +'<div style="min-width:0"><div class="upd-name">'+esc(name)+'</div>'
    +'<div class="upd-meta"><span>'+fmtSize(size)+'</span><span id="upd_time">'+fmtClock(new Date())+' 开始</span></div></div></div>'
    +'<div class="upd-bar"><i class="upd-fill" id="upd_fill"></i></div>'
    +'<div class="upd-foot"><span class="upd-pct" id="upd_pct">0%</span><span class="upd-state" id="upd_state">正在上传…</span></div>'
    +'</div>';
  document.body.appendChild(m);
  UPD_START=Date.now();
  clearInterval(UPD_TIMER);
  UPD_TIMER=setInterval(function(){
    var el=document.getElementById("upd_time");
    if(el)el.textContent=fmtClock(new Date())+" 开始 · 已用 "+Math.round((Date.now()-UPD_START)/1000)+" 秒";
  },1000);
}
function updProg(p){
  var f=document.getElementById("upd_fill");if(f)f.style.width=Math.max(2,p)+"%";
  var t=document.getElementById("upd_pct");if(t)t.textContent=p+"%";
  var s=document.getElementById("upd_state");if(s)s.textContent="正在上传…";
}
function updDone(ok,msg){
  clearInterval(UPD_TIMER);
  var box=document.getElementById("upd_box");
  if(box)box.classList.add(ok?"upd-ok":"upd-err");
  var f=document.getElementById("upd_fill");if(f)f.style.width="100%";
  var t=document.getElementById("upd_pct");if(t)t.textContent=ok?"100%":"失败";
  var s=document.getElementById("upd_state");if(s)s.textContent=msg||(ok?"上传完成":"上传失败");
  var el=document.getElementById("upd_time");if(el)el.textContent=(ok?"已上传 ":"耗时 ")+Math.round((Date.now()-UPD_START)/1000)+" 秒";
  setTimeout(function(){var m=document.getElementById("upd_mask");if(m)m.remove()},ok?1400:3600);
}
function uploadFile(file,onOk,onFail,onProg){
  var fd=new FormData();
  fd.append("backstage",CONFIG.backstage);fd.append("appid",CONFIG.appid);fd.append("key",CONFIG.key);
  fd.append("file",file,tsName(file.name));
  // 改用 XHR：支持实时上传进度（onProg 回调返回 0-100），fetch 无法读取上传进度
  var xhr=new XMLHttpRequest();
  xhr.open("POST",CONFIG.softBase+"FileUpload.php");
  if(onProg)xhr.upload.onprogress=function(e){if(e.lengthComputable)onProg(Math.min(99,Math.round(e.loaded/e.total*100)))};
  xhr.onload=function(){
    var j=null;try{j=JSON.parse(xhr.responseText)}catch(e){}
    if(xhr.status>=200&&xhr.status<300&&j&&(j.code==="1"||j.code===1)&&j.url){onOk(j.url)}else{onFail(j&&j.msg||"上传失败")}
  };
  xhr.onerror=function(){onFail("网络错误")};
  xhr.send(fd);
}

var THEME_HEX_FROM=null;
function themeHexFrom(){
  if(THEME_HEX_FROM)return THEME_HEX_FROM;
  var list=["#ff4a3a","#ff8a3a","#00c98d","#00e0a4","#3d72f0","#ff4d4f","#f3f4f7","#14151a","#333","#666","#5b6478","#98a0b3","#ececf2","#181a25","#2b3a67","#2b3448","#111"];
  Object.keys(THEME_COLORS).forEach(function(k){var v=THEME_COLORS[k];if(list.indexOf(v[0])<0)list.push(v[0]);if(list.indexOf(v[1])<0)list.push(v[1])});
  ["#e9eaf0","#b6bccc","#8a92a6","#cfd4e0","#a0a7b8","#2a2e3a","#1d2029","#9fb0d8","#000"].forEach(function(h){if(list.indexOf(h)<0)list.push(h)});
  THEME_HEX_FROM=list;return list;
}
function toThemeHex(h,pri,pri2,dark){
  if(h===pri||h===pri2)return h;
  if(h==="#ff4a3a")return pri;if(h==="#ff8a3a")return pri2;
  if(h==="#00c98d"||h==="#00e0a4"||h==="#3d72f0"||h==="#ff4d4f")return h;
  var ks=Object.keys(THEME_COLORS),i,v;
  for(i=0;i<ks.length;i++){v=THEME_COLORS[ks[i]];if(v[0]===h)return pri;if(v[1]===h)return pri2}
  if(dark){
    if(h==="#f3f4f7")return "#14151a";if(h==="#14151a"||h==="#333"||h==="#111"||h==="#2b3448"||h==="#000")return "#e9eaf0";
    if(h==="#666")return "#a0a7b8";if(h==="#5b6478"||h==="#2b3a67")return "#b6bccc";if(h==="#98a0b3")return "#8a92a6";
    if(h==="#ececf2")return "#2a2e3a";if(h==="#181a25")return "#000";
    if(h==="#1d2029"||h==="#e9eaf0"||h==="#b6bccc"||h==="#8a92a6"||h==="#cfd4e0"||h==="#a0a7b8"||h==="#2a2e3a"||h==="#9fb0d8")return h;
    return h;
  }
  if(h==="#e9eaf0")return "#14151a";if(h==="#b6bccc")return "#5b6478";if(h==="#8a92a6")return "#98a0b3";
  if(h==="#cfd4e0")return "#333";if(h==="#a0a7b8")return "#666";if(h==="#2a2e3a")return "#ececf2";
  if(h==="#1d2029")return "#fff";if(h==="#9fb0d8")return "#2b3a67";if(h==="#000")return "#181a25";
  return h;
}
function recolorStyleStr(str){
  var s=getSet(),c=THEME_COLORS[s.themeColor]||THEME_COLORS.default,dark=s.themeMode==="dark",pri=c[0],pri2=c[1],list=themeHexFrom(),out=str;
  for(var i=0;i<list.length;i++){var hex=list[i];if(hex==="#fff"||hex==="#1d2029")continue;out=out.split(hex).join(toThemeHex(hex,pri,pri2,dark))}
  if(dark){out=out.replace(/(background(?:-color)?\s*:\s*)(#fff|#1d2029)\b/gi,"$1#1d2029")}
  else{out=out.replace(/(background(?:-color)?\s*:\s*)(#fff|#1d2029)\b/gi,"$1#fff")}
  return out;
}

function identifyNetdisks(content){
  var urls=(String(content||"").match(/https?:\/\/[^\s<>\[\]"'，。；、！？]+/g)||[]).filter(function(u){return u.indexOf("...")<0});
  var rules=getNetdiskRules();var out=[];
  urls.forEach(function(u){
    for(var i=0;i<rules.length;i++){
      var keys=String(rules[i][1]||"").split(",").map(function(s){return String(s||"").trim()}).filter(Boolean);
      for(var k=0;k<keys.length;k++){
        if(keys[k]&&u.indexOf(keys[k])>=0){
          if(!out.some(function(o){return o.url===u}))out.push({name:rules[i][0],url:u,host:(String(u).match(/^https?:\/\/([^\/?#]+)/)||[])[1]||u});
          break;
        }
      }
      if(out.some(function(o){return o.url===u}))break;
    }
  });
  return out;
}

function saveProfile(){
  var a=auth();if(!a){toast("请先登录");return}
  var g=function(id){return String((document.getElementById(id)||{}).value||"").trim()};
  var name=g("ep_name"), sign=g("ep_sign"), qq=g("ep_qq"), email=g("ep_email"), oldpw=g("ep_oldpw"), newpw=g("ep_newpw");
  
  if(!name){toast("昵称不能为空");return}
  
  var ops=[];
  
  // 比对原数据，只有真正发生改变的字段才提交
  if(name !== String(USER.name || USER.user_name || "")) {
    ops.push(["user_name.php", {name: name}]);
  }
  if(sign !== String(USER.autograph || "")) {
    ops.push(["user_qm.php", {autograph: sign}]);
  }
  if(qq !== String(USER.QQ || "")) {
    ops.push(["user_qq.php", {QQ: qq}]);
  }
  if(email !== String(USER.email || "")) {
    ops.push(["user_email.php", {email: email}]);
  }
  if(newpw){
    if(!oldpw){toast("请填写原密码");return}
    ops.push(["user_pass.php", {pass: oldpw, password: newpw}]);
  }
  
  if(ops.length === 0) {
    toast("资料未发生改变");
    return;
  }
  
  var done=false,firstErr="";
  (function next(i){
    if(done)return;
    if(i>=ops.length){
      done=true;
      if(!firstErr){
        USER.name=name; USER.user_name=name; USER.autograph=sign; USER.QQ=qq; USER.email=email;
        if(newpw){saveAuth(a.user,newpw)}
        try { localStorage.setItem("yh_user", JSON.stringify(USER)); } catch(e){}
        // 重置头像防缓存标记：换绑 QQ / 改资料后头像立即从云端重新拉取
        AVT_TS=(Date.now()).toString(36);
        toast("保存成功");
        loadUser(function(){try{renderRoute()}catch(e){}});
        go("profile");
      }
      return;
    }
    var o=ops[i];var params=[["appid",CONFIG.appid],["key",CONFIG.key],["user",String(a.user)]];
    Object.keys(o[1]).forEach(function(k){params.push([k,o[1][k]])});
    apiPost(CONFIG.APIBase+o[0],params).then(function(j){
      if(forumOk(j)){next(i+1)}
      else{if(!firstErr){firstErr=j&&j.msg||"保存失败";toast(firstErr);done=true}}
    }).catch(function(){if(!firstErr){firstErr="网络错误";toast(firstErr);done=true}});
  })(0);
}

function atPick(id,nick,acct){
  var s=document.getElementById("atSheet");if(s)s.remove();
  if(acct)AT_USERS[nick]=acct;

  if(/#$/.test(v)||/@$/.test(v)){v=v.replace(/@+$/,"")+"@"+nick}
  else{v=(v?" ":"")+"@"+nick}
  e.value=v;e.focus();

function atFrom(text){
  var t=String(text||"");
  var m=t.match(/@(\d{4,})/);if(m)return m[1];
  var seg=String(t).split("@");
  var keys=Object.keys(AT_USERS);
  for(var i=seg.length-1;i>=1;i--){
    var s=seg[i];var matched="";
    for(var k=0;k<keys.length;k++){
      if(s.indexOf(keys[k])===0&&keys[k].length>matched.length)matched=keys[k];
    }
    if(matched&&AT_USERS[matched])return AT_USERS[matched];
  }
  return "";
}

function doEditSave(id){
  var a=auth();if(!a){toast("请先登录");return}
  var plate=currentPubPlate();
  var mini=String(plate)===String(CONFIG.MINI_PLATE);
  var name=(document.getElementById("pg_name").value||"").trim();
  var ver=(document.getElementById("pg_ver").value||"").trim();
  if(!name){toast("请输入资源名称");return}
  if(name.length<2||name.length>16){toast("资源名称需 2~16 个文字");return}
  var title="",content="";
  var imgContent=(PUB.coverUrl?("\n[img]"+PUB.coverUrl+"[/img]"):"");
  if(mini){
    var jump=(document.getElementById("pg_jump").value||"").trim();
    if(!jump){toast("请填写跳转链接");return}
    title="[小程序]"+name;
    content="名称:"+name+"\n版本:"+(ver||"1.0")+"\n跳转链接:"+jump+imgContent;
  }else{
    var f=pubResFields();var pkg=f.pkg,mem=f.mem,dl=f.dl,desc=f.desc;
    if(pkg&&!/^[a-zA-Z.]+$/.test(pkg)){toast("包名只允许字母和点");return}
    if(!dl){toast("请填写或上传下载链接");return}
    if(PUB.screens.length>0&&PUB.screenUrls.some(function(u){return !u})){toast("部分截图正在上传中，请稍候...");return}
    PUB.screenUrls.forEach(function(url){if(url)imgContent+="\n[img]"+url+"[/img]"});
    title="[游戏分享]"+name;
    content="游戏名称:"+name+"\n游戏版本:"+(ver||"1.0")+"\n下载链接:"+dl+(pkg?"\n包名:"+pkg:"")+(mem?"\n内存:"+mem:"")+(desc?"\n简介:"+desc:"")+imgContent;
  }
  var _pv=payVals();
  if(!mini&&_pv.on&&_pv.coin<=0){toast("付费资源请填写金币数");return}
  confirmDialog("保存修改将删除原帖子并重新提交审核，确定继续？",function(){
    cleanPostImages(id).then(function(){
      apiPost(CONFIG.forumBase+"post_delete.php",forumAuth().concat([["user",a.user],["post_id",id]])).then(function(jd){
        if(!forumOk(jd)){toast(jd&&jd.msg||"删除原帖失败");return}
        var fd=new FormData();
        fd.append("appid",CONFIG.appid);fd.append("key",CONFIG.key);
        fd.append("user",a.user);fd.append("user_name",USER.user_name||USER.name||a.user);
        fd.append("plate_id",plate);fd.append("title",title);fd.append("content",content);
        if(!mini&&_pv.on){fd.append("is_coin_switch","1");fd.append("coin",String(_pv.coin))}
        fetch(CONFIG.forumBase+"post_publish.php",{method:"POST",body:fd}).then(function(r){return r.json().catch(function(){return null})})
          .then(function(j){toast(forumOk(j)?(j.msg||"保存成功"):(j&&j.msg||"保存失败"));if(forumOk(j)){CUR_UP_PLATE=plate;go("up")}})
          .catch(function(){toast("网络错误")});
      }).catch(function(){toast("网络错误")});
    }).catch(function(){toast("网络错误")});
  });
}
/* 帖子类编辑保存：删除原帖 → 重新提交（重新审核） */
function doComEditSave(id){
  var a=auth();if(!a){toast("请先登录");return}
  var title=String((document.getElementById("cp_title")||{}).value||"").trim();
  var content=String((document.getElementById("cp_content")||{}).value||"").trim();

      cleanPostImages(id).then(function(){
        apiPost(CONFIG.forumBase+"post_delete.php",forumAuth().concat([["user",a.user],["post_id",id]])).then(function(jd){
          if(!forumOk(jd)){toast(jd&&jd.msg||"删除原帖失败");return}

          fetch(CONFIG.forumBase+"post_publish.php",{method:"POST",body:fd}).then(function(r){return r.json().catch(function(){return null})})
            .then(function(j){toast(forumOk(j)?(j.msg||"保存成功"):(j&&j.msg||"保存失败"));if(forumOk(j)){CPUB={};go("discover")}})
            .catch(function(){toast("网络错误")});
        }).catch(function(){toast("网络错误")});
      }).catch(function(){toast("网络错误")});
    };
    if(CPUB.cover&&CPUB.isVid){
      toast("视频上传中…");

        uploadFile(CPUB.cover,function(url){
          content=content+"\n[video]"+url+"[/video]";

    }

  });
}

function notifyIcon(n){
  var t=n.type||"",c=n.content||"";
  if(t==="audit_post")return /通过|成功/.test(c)?{ic:"check",bg:"#22c55e"}:{ic:"x",bg:"#ff4a3a"};
  if(t==="like_post"||t==="like_comment")return {ic:"like",bg:"#ff5b6a"};
  if(t==="comment_post")return {ic:"comment",bg:"#4e7cff"};
  if(t==="reply_comment")return {ic:"reply",bg:"#7c6bff"};
  if(t==="at_user")return {ic:"at",bg:"#a05bff"};
  if(t==="follow_user")return {ic:"userplus",bg:"#22c55e"};
  if(t==="follow_post")return {ic:"bookmark",bg:"#ff9f2e"};
  if(t==="buy_post")return {ic:"coin",bg:"#ff9f2e"};
  if(t==="report_result")return {ic:"shield",bg:"#ff5b6a"};
  if(t==="top_post")return {ic:"pin",bg:"#4e7cff"};
  return {ic:"bell",bg:"#8a92a6"};
}

function doRegister(){

  var p1=(document.getElementById("rg_pass").value||"").trim();
  var p2=(document.getElementById("rg_pass2").value||"").trim();

  var code=(document.getElementById("rg_code").value||"").trim();
