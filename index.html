var __lgCleanup=null;
function initLoginAnim(){
  function q(i){return document.getElementById(i)}
  // 关键：每次进入登录/注册页先取消上一次的所有动画循环与监听器，
  // 杜绝“去注册/去登录”反复切换时 rAF 循环、定时器、事件监听不断累积（界面错乱、堆叠、卡顿）
  if(__lgCleanup){try{__lgCleanup()}catch(e){}__lgCleanup=null}
  var user=q("li_user")||q("rg_user");
  var pw=q("li_pass")||q("rg_pass");
  var pw2=q("rg_pass2");
  var purple=q("purple"),black=q("black"),orange=q("orange"),yellow=q("yellow");
  var purpleEyes=q("purple-eyes"),blackEyes=q("black-eyes"),orangeEyes=q("orange-eyes"),yellowEyes=q("yellow-eyes");
  var yellowMouth=q("yellow-mouth");
  if(!purple)return;
  var alive=true,rafId=0,toIds=[],itvIds=[];
  var ctrl=(typeof AbortController==="function")?new AbortController():null;
  var opts=ctrl?{signal:ctrl.signal}:undefined;
  __lgCleanup=function(){
    alive=false;
    if(rafId)cancelAnimationFrame(rafId);
    itvIds.forEach(function(i){clearInterval(i)});
    toIds.forEach(function(t){clearTimeout(t)});
    if(ctrl)ctrl.abort();
  };
  var mouseX=window.innerWidth/2,mouseY=window.innerHeight/2;
  var isTyping=false,showPassword=false,passwordLen=0;
  var purpleBlink=false,blackBlink=false,lookingAtEachOther=false,purplePeeking=false;
  function onMouse(e){mouseX=e.clientX;mouseY=e.clientY}
  function onTouch(e){var t=e.touches&&e.touches[0];if(t){mouseX=t.clientX;mouseY=t.clientY}}
  document.addEventListener("mousemove",onMouse,opts);
  document.addEventListener("touchmove",onTouch,opts);
  function triggerLookAtEachOther(){lookingAtEachOther=true;toIds.push(setTimeout(function(){lookingAtEachOther=false},800))}
  function bindFocus(el){if(!el)return;el.addEventListener("focus",function(){isTyping=true;triggerLookAtEachOther()});el.addEventListener("blur",function(){isTyping=false;lookingAtEachOther=false})}
  bindFocus(user);bindFocus(pw);
  if(pw){pw.addEventListener("input",function(){passwordLen=pw.value.length})}
  function bindToggle(inp,tog){if(!inp||!tog)return;var show=false;tog.addEventListener("click",function(){show=!show;inp.type=show?"text":"password";tog.innerHTML=show?EYE_OFF:EYE_ON})}
  bindToggle(pw,q("togglePw"));bindToggle(pw,q("rgTog1"));bindToggle(pw2,q("rgTog2"));
  function scheduleBlink(setter){if(!alive)return;var delay=Math.random()*4000+3000;toIds.push(setTimeout(function(){if(!alive)return;setter(true);toIds.push(setTimeout(function(){if(!alive)return;setter(false);scheduleBlink(setter)},150))},delay))}
  scheduleBlink(function(v){purpleBlink=v});scheduleBlink(function(v){blackBlink=v});
  function schedulePeek(){if(!alive)return;if(passwordLen>0&&showPassword){var delay=Math.random()*3000+2000;toIds.push(setTimeout(function(){if(!alive)return;if(passwordLen>0&&showPassword){purplePeeking=true;toIds.push(setTimeout(function(){if(!alive)return;purplePeeking=false;schedulePeek()},800))}},delay))}}
  itvIds.push(setInterval(function(){if(passwordLen>0&&showPassword&&!purplePeeking)schedulePeek()},1000));
  function calcPos(el){var rect=el.getBoundingClientRect();var cx=rect.left+rect.width/2,cy=rect.top+rect.height/3;var dx=mouseX-cx,dy=mouseY-cy;return{faceX:Math.max(-15,Math.min(15,dx/20)),faceY:Math.max(-10,Math.min(10,dy/30)),bodySkew:Math.max(-6,Math.min(6,-dx/120))}}
  function eyePupilOffset(el,maxDist,forceX,forceY){if(forceX!==undefined&&forceY!==undefined)return{x:forceX,y:forceY};var rect=el.getBoundingClientRect();var cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;var dx=mouseX-cx,dy=mouseY-cy;var dist=Math.min(Math.sqrt(dx*dx+dy*dy),maxDist);var angle=Math.atan2(dy,dx);return{x:Math.cos(angle)*dist,y:Math.sin(angle)*dist}}
  function render(){
    if(!alive)return;
    var pp=calcPos(purple),bp=calcPos(black),op=calcPos(orange),yp=calcPos(yellow);
    var isHiding=passwordLen>0&&!showPassword,isShowingPw=passwordLen>0&&showPassword;
    if(isShowingPw){purple.style.transform="skewX(0deg)";purple.style.height="400px"}
    else if(isTyping||isHiding){purple.style.transform="skewX("+((pp.bodySkew||0)-12)+"deg) translateX(40px)";purple.style.height="440px"}
    else{purple.style.transform="skewX("+(pp.bodySkew||0)+"deg)";purple.style.height="400px"}
    var purpleEyeL=purpleEyes.children[0],purpleEyeR=purpleEyes.children[1];
    purpleEyeL.style.height=purpleBlink?"2px":"18px";purpleEyeR.style.height=purpleBlink?"2px":"18px";
    var pfx,pfy;
    if(isShowingPw){purpleEyes.style.left="20px";purpleEyes.style.top="35px";pfx=-4;pfy=-4}
    else if(lookingAtEachOther){purpleEyes.style.left="55px";purpleEyes.style.top="65px";pfx=3;pfy=4}
    else{purpleEyes.style.left=(45+pp.faceX)+"px";purpleEyes.style.top=(40+pp.faceY)+"px";pfx=undefined;pfy=undefined}
    setPupil(purpleEyeL,5,pfx,pfy);setPupil(purpleEyeR,5,pfx,pfy);
    if(isShowingPw){black.style.transform="skewX(0deg)"}
    else if(lookingAtEachOther){black.style.transform="skewX("+((bp.bodySkew||0)*1.5+10)+"deg) translateX(20px)"}
    else if(isTyping||isHiding){black.style.transform="skewX("+((bp.bodySkew||0)*1.5)+"deg)"}
    else{black.style.transform="skewX("+(bp.bodySkew||0)+"deg)"}
    var blackEyeL=blackEyes.children[0],blackEyeR=blackEyes.children[1];
    blackEyeL.style.height=blackBlink?"2px":"16px";blackEyeR.style.height=blackBlink?"2px":"16px";
    var bfx,bfy;
    if(isShowingPw){blackEyes.style.left="10px";blackEyes.style.top="28px";bfx=-4;bfy=-4}
    else if(lookingAtEachOther){blackEyes.style.left="32px";blackEyes.style.top="12px";bfx=0;bfy=-4}
    else{blackEyes.style.left=(26+bp.faceX)+"px";blackEyes.style.top=(32+bp.faceY)+"px";bfx=undefined;bfy=undefined}
    setPupil(blackEyeL,4,bfx,bfy);setPupil(blackEyeR,4,bfx,bfy);
    orange.style.transform=isShowingPw?"skewX(0deg)":"skewX("+(op.bodySkew||0)+"deg)";
    var ofx,ofy;
    if(isShowingPw){orangeEyes.style.left="50px";orangeEyes.style.top="85px";ofx=-5;ofy=-4}
    else{orangeEyes.style.left=(82+(op.faceX||0))+"px";orangeEyes.style.top=(90+(op.faceY||0))+"px";ofx=undefined;ofy=undefined}
    setPupilOnly(orangeEyes.children[0],5,ofx,ofy);setPupilOnly(orangeEyes.children[1],5,ofx,ofy);
    yellow.style.transform=isShowingPw?"skewX(0deg)":"skewX("+(yp.bodySkew||0)+"deg)";
    var yfx,yfy;
    if(isShowingPw){yellowEyes.style.left="20px";yellowEyes.style.top="35px";yellowMouth.style.left="10px";yellowMouth.style.top="88px";yfx=-5;yfy=-4}
    else{yellowEyes.style.left=(52+(yp.faceX||0))+"px";yellowEyes.style.top=(40+(yp.faceY||0))+"px";yellowMouth.style.left=(40+(yp.faceX||0))+"px";yellowMouth.style.top=(88+(yp.faceY||0))+"px";yfx=undefined;yfy=undefined}
    setPupilOnly(yellowEyes.children[0],5,yfx,yfy);setPupilOnly(yellowEyes.children[1],5,yfx,yfy);
    rafId=requestAnimationFrame(render);
  }
  function setPupil(eyeEl,maxDist,forceX,forceY){var pupil=eyeEl.querySelector(".pupil");if(!pupil)return;var o=eyePupilOffset(eyeEl,maxDist,forceX,forceY);pupil.style.transform="translate("+o.x+"px,"+o.y+"px)"}
  function setPupilOnly(el,maxDist,forceX,forceY){var o=eyePupilOffset(el,maxDist,forceX,forceY);el.style.transform="translate("+o.x+"px,"+o.y+"px)"}
  rafId=requestAnimationFrame(render);
}

/* init：未登录→登录页；已登录→首页 */
/* 横向滚动容器（截图区/首页横滑/UP其他分享）：JS 完全接管手势，绕开 WebView 的手势路由。
   横向手势→手动滚动容器；纵向手势→手动滚动页面，杜绝横滑区域上下滑不动。
   带速度历史惯性：快速滑动松手后继续滚动。
   不可横向滚动的容器（如截图区只有1张图）不接管，手势完全放行，避免“划了卡住”。
   采用 document 事件委托，动态渲染的容器同样生效 */
(function(){
  var SEL=["h-scroll","h-scroll2","mini-res-scroll"];
  function hitScrollEl(t){var n=t;while(n&&n!==document&&n!==document.body){if(n.classList){for(var i=0;i<SEL.length;i++){if(n.classList.contains(SEL[i]))return n}}n=n.parentNode}return null}
  function vel(hist,now){var sum=0,cnt=0;for(var i=hist.length-1;i>=0;i--){var age=now-hist[i].t;if(age>90)break;var w=1-age/100;sum+=hist[i].v*w;cnt+=w}return cnt?sum/cnt*3:0}
  var cur=null;
  document.addEventListener("touchstart",function(e){cur=null;var el=hitScrollEl(e.target);if(el&&e.touches&&e.touches[0]){var t=e.touches[0];if(el.scrollWidth>el.clientWidth+2){cur={el:el,x:t.clientX,y:t.clientY,lock:"",hist:[]}}else{cur={el:el,x:t.clientX,y:t.clientY,lock:"v",hist:[]}}}},{passive:true});
  document.addEventListener("touchmove",function(e){
    if(!cur||!cur.el)return;var t=e.touches&&e.touches[0];if(!t)return;var now=performance.now();
    var el=cur.el,dx=t.clientX-cur.x,dy=t.clientY-cur.y;
    if(!cur.lock&&(Math.abs(dx)>6||Math.abs(dy)>6))cur.lock=Math.abs(dx)>Math.abs(dy)?"h":"v";
    var atH0=el.scrollLeft<=0,atH1=el.scrollLeft>=el.scrollWidth-el.clientWidth;
    var pageEnd=window.scrollY>=document.body.scrollHeight-window.innerHeight-1;
    if(cur.lock==="h"){
      e.preventDefault();
      if(Math.abs(dy)>Math.abs(dx)&&((dx>0&&atH0)||(dx<0&&atH1))){cur.lock="v";cur.x=t.clientX;cur.y=t.clientY;cur.hist.length=0;window.scrollBy(0,-dy);cur.hist.push({t:now,v:dy})}
      else{el.scrollLeft-=dx;cur.hist.push({t:now,v:dx});if(cur.hist.length>8)cur.hist.shift();cur.x=t.clientX;cur.y=t.clientY}
    }else if(cur.lock==="v"){
      e.preventDefault();
      if(Math.abs(dx)>Math.abs(dy)&&((dy>0&&window.scrollY<=0)||(dy<0&&pageEnd))){cur.lock="h";cur.x=t.clientX;cur.y=t.clientY;cur.hist.length=0;el.scrollLeft-=dx;cur.hist.push({t:now,v:dx})}
      else{window.scrollBy(0,-dy);cur.hist.push({t:now,v:dy});if(cur.hist.length>8)cur.hist.shift();cur.x=t.clientX;cur.y=t.clientY}
    }
  },{passive:false});
  function end(){if(!cur)return;if(cur.lock==="h"){var v=vel(cur.hist,performance.now()),el=cur.el;(function step(){if(Math.abs(v)<0.4)return;el.scrollLeft-=v;v*=0.92;requestAnimationFrame(step)})()}else if(cur.lock==="v"){var v2=vel(cur.hist,performance.now());(function step2(){if(Math.abs(v2)<0.4)return;window.scrollBy(0,-v2);v2*=0.92;requestAnimationFrame(step2)})()}cur=null}
  document.addEventListener("touchend",end,{passive:true});
  document.addEventListener("touchcancel",end,{passive:true});
})();
/* ===== 强制更新检查：对接后台 update_obtain.php ===== */
function verParts(v){return String(v||"").split(".").map(function(n){var x=parseInt(n,10);return isNaN(x)?0:x})}
function verGt(a,b){
  var A=verParts(a),B=verParts(b),L=Math.max(A.length,B.length);
  for(var i=0;i<L;i++){var x=A[i]||0,y=B[i]||0;if(x>y)return true;if(x<y)return false}
  return false;
}

var UPDATE_LINK="",UPDATE_EDITION="";
function checkUpdate(){
  apiPost(CONFIG.softBase+"api/update_obtain.php",[["user",CONFIG.backstage],["appid",CONFIG.appid]]).then(function(j){
    if(!j||String(j.code)!=="1")return;
    var ed=String(j.edition||"").trim();
    var lk=String(j.link||"").trim();
    // 仅当后台版本高于本地版本且已配置有效下载链接时弹窗（后台未配链接则不弹，避免死锁卡死用户）
    if(!verGt(ed,APP_VERSION))return;
    if(!lk||lk==="无下载链接")return;
    UPDATE_LINK=lk;UPDATE_EDITION=ed;
    showForceUpdate(String(j.content||"").trim());
  }).catch(function(){});
}
function showForceUpdate(content){
  if(document.getElementById("upd_force_mask"))return;
  var m=document.createElement("div");m.className="modal-mask";m.id="upd_force_mask";
  m.innerHTML='<div class="modal-card" style="text-align:center">'
    +'<div style="width:52px;height:52px;margin:0 auto 10px;border-radius:16px;background:linear-gradient(135deg,#ff4a3a,#ff8a3a);color:#fff;display:flex;align-items:center;justify-content:center">'+icon("download")+'</div>'
    +'<div class="modal-tit">发现新版本v'+esc(UPDATE_EDITION)+'</div>'
    +'<div class="modal-msg" style="white-space:pre-wrap;text-align:left">'+(content?esc(content):'请更新到最新版本后继续使用')+'</div>'
    +'<button style="display:block;margin:14px auto 0;border:0;background:transparent;color:#4a6cf7;font-size:14px;font-weight:600;cursor:pointer" onclick="copyForceLink()">复制更新链接</button>'
    +'<div class="modal-acts"><button class="btn btn-primary" onclick="doForceUpdate()">立即更新</button></div>'
    +'</div>';
  // 强制更新弹窗：无关闭按钮，点击遮罩/返回均不关闭，直至用户更新到最新版本
  m.addEventListener("click",function(e){e.stopPropagation()});
  document.body.appendChild(m);
}
function copyForceLink(){
  if(!UPDATE_LINK){toast("暂无下载链接");return}
  copyText(UPDATE_LINK);
  toast("更新链接已复制");
}
function doForceUpdate(){
  if(!UPDATE_LINK)return;
  if(window.webcat&&webcat.browser){try{webcat.browser.open(UPDATE_LINK)}catch(e){window.open(UPDATE_LINK,"_blank")}}
  else{window.open(UPDATE_LINK,"_blank")}
  toast("正在打开下载页面，请安装最新版本");
  // 弹窗保留不关闭：更新后版本号变新，下次启动不再弹出
}
(function init(){
  applyTheme();
  (function(){var sp=document.getElementById("splash");setTimeout(function(){if(sp){sp.classList.add("hide");setTimeout(function(){if(sp&&sp.parentNode)sp.parentNode.removeChild(sp)},520)}},1250)})();
  checkUpdate();
  if(auth()){try{var _c=localStorage.getItem("yh_user");if(_c)USER=JSON.parse(_c)}catch(e){};loadUser(function(){try{renderRoute()}catch(e){}});if(!location.hash||location.hash==="#"||location.hash==="#login")go("home")}
  else{var _h0=String(location.hash||"");if(_h0!=="#register"){try{history.replaceState(null,"","#login")}catch(e){location.hash="#login"}}renderRoute()}
})();
</script>
